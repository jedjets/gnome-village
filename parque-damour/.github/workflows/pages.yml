# Inert: this file lives under parque-damour/.github/, not at the repository root, so GitHub never runs it.
# Pages deployment for this app is deferred (register row 4, 2026-10-11); the file is the recipe for the optional
# separate repository of register section 7 (build plan S0.7 item 5).
name: pages
on: { push: { branches: [main] } }
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
