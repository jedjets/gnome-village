<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DCE6EC">
<title>Parque D'Amour: Style Gate</title>
<link rel="stylesheet" href="./src/styles/tokens.css">
<!-- The Style Gate board (04 section 4). Every colour below is a token of tokens.css; the direction theme colours come from
     src/render/ambient.ts through the script. The chip, tool pill, group and card recipes are those of 04 1.10 and 5.2. -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--body-bg);color:var(--ink);font-family:var(--ui);font-size:12px;line-height:1.3}
body{padding:0 16px calc(env(safe-area-inset-bottom,0px) + 32px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;
  background:var(--glass);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-bottom:1px solid var(--glass-line)}
#top h1{margin:0;font-family:var(--display);font-size:18px;font-weight:700;flex:1 1 auto;min-width:0}
.grp{display:flex;gap:4px;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:4px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:var(--shadow)}
.gb{border:0;background:transparent;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;line-height:1.3;
  font-weight:600;color:var(--ink-soft);cursor:pointer;min-width:36px;min-height:28px}
.gb[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.gb:focus-visible,.choose:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.choose{border:0;border-radius:999px;background:var(--ink);color:var(--on-ink);font:inherit;font-size:15px;font-weight:700;
  padding:9px 18px;box-shadow:var(--shadow-lift);cursor:pointer;min-height:36px}
.choose[aria-pressed="true"]{background:var(--moss);color:var(--ink)}
#choosePhone{display:flex}
#board{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-top:14px;align-items:start}
.colhead{display:none}
.tile{margin:0;display:none;flex-direction:column;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--glass-line);
  border-radius:14px;padding:8px 6px 7px;box-shadow:var(--shadow);min-width:0}
.tile.wide{grid-column:1 / -1}
body[data-dir="A"] .tile[data-dir="A"],body[data-dir="B"] .tile[data-dir="B"],body[data-dir="C"] .tile[data-dir="C"]{display:flex}
.tilebody{max-width:100%;overflow:hidden;border-radius:8px}
.tile canvas{display:block;max-width:100%}
figcaption{font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.3}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:8;
  background:var(--toast);color:var(--on-ink);font-size:12px;font-weight:500;padding:7px 14px;border-radius:16px;opacity:0;
  transition:opacity .3s;pointer-events:none;max-width:88vw;text-align:center}
#hint.on{opacity:1}
/* tile 1: the palette strip, 2 rows of 8, with a legend */
.swatches{width:320px;max-width:100%}
.swgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;height:72px}
.sw{border-radius:5px;border:1px solid var(--glass-line)}
.swlegend{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;margin-top:6px;font-size:11px;color:var(--ink-soft)}
.swrow{display:flex;gap:5px;align-items:center;white-space:nowrap}
.swrow i{width:9px;height:9px;border-radius:3px;border:1px solid var(--glass-line);flex:0 0 9px}
.swrow b{color:var(--ink);font-weight:600}
.swrow span{font-variant-numeric:tabular-nums}
/* tile 13: the HUD sample on the direction's theme colour */
.hudwrap{width:320px;height:200px;max-width:100%;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hudrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hudrow.r2{max-width:140px;align-items:flex-start}
.chip{background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:4px 9px;font:inherit;font-size:12px;
  font-weight:500;line-height:1.3;color:var(--ink);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:var(--shadow);
  white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.chip b{font-weight:700}
.chip .sep{width:1px;height:11px;background:var(--glass-line)}
.chip.cd{font-size:11px;color:var(--ember);font-weight:600}
.dotm{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:-3px;background:var(--sky)}
.plus{margin-left:-2px;width:18px;height:18px;border-radius:50%;border:1px solid var(--glass-line);background:var(--ink);color:var(--on-ink);
  font:inherit;font-size:13px;font-weight:700;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.tool{background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:7px 11px 6px;display:inline-flex;flex-direction:column;
  align-items:center;gap:3px;font:inherit;font-size:11px;line-height:1.3;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;box-shadow:var(--shadow)}
.tool .sw{width:17px;height:17px;border-radius:6px;border:1.5px solid var(--swatch-line)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);transform:translateY(-2px)}
.tool[aria-pressed="true"] .sw{border-color:var(--on-ink-line)}
.card{position:absolute;right:10px;bottom:10px;max-height:150px;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:7px 12px 8px;
  box-shadow:var(--shadow);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);width:170px}
.card h3{margin:0 0 1px;font-family:var(--display);font-size:16px;font-weight:700;line-height:1.3}
.card .sub{font-size:11px;color:var(--ink-soft);margin-bottom:4px}
.bar{display:grid;grid-template-columns:46px 1fr;gap:6px;align-items:center;margin-top:3px;font-size:11px;color:var(--ink-soft);
  letter-spacing:.03em;text-transform:uppercase;font-weight:600}
.bar i{display:block;height:4px;border-radius:3px;background:var(--paper-2);overflow:hidden;font-style:normal}
.bar i>u{display:block;height:100%;border-radius:3px;text-decoration:none;background:var(--moss)}
.bar.heart i>u{background:var(--berry)}
.card .doing{margin-top:5px;font-size:12px;font-style:italic;font-family:var(--display);color:var(--ink)}
@media (min-width:900px){
  #switch,#choosePhone{display:none}
  #board{grid-template-columns:repeat(3,400px);justify-content:center;gap:14px 16px}
  .colhead{display:flex;flex-direction:column;align-items:center;gap:8px;grid-row:1;padding:6px 0 2px}
  .colhead[data-dir="A"]{grid-column:1}.colhead[data-dir="B"]{grid-column:2}.colhead[data-dir="C"]{grid-column:3}
  .colhead h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700}
  .tile,.tile.wide{display:flex;grid-row:var(--row)}
  .tile[data-dir="A"]{grid-column:1}.tile[data-dir="B"]{grid-column:2}.tile[data-dir="C"]{grid-column:3}
}
@media (prefers-reduced-motion:reduce){#hint,.tool{transition:none}}
</style>
</head>
<body data-dir="A">
<header id="top">
  <h1 id="title">Parque D'Amour: Style Gate</h1>
  <div class="grp" id="switch" role="group"></div>
  <div id="choosePhone"></div>
</header>
<main id="board"></main>
<div id="hint" aria-live="polite"></div>
<script type="module" src="./src/debug/style-board.ts"></script>
</body>
</html>
