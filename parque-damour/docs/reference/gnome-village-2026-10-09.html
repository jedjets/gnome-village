  const ci=I(clamp(Math.round(g.x),0,N-1),clamp(Math.round(g.y),0,N-1));
  const onBridge=BRIDGE[ci]>0;
  const wd=(onBridge||ICE[ci])?0:wetD(ci);
  g.swim = wd>0.55 ? Math.min(1,g.swim+dt*3) : Math.max(0,g.swim-dt*3);
  g.moving=false;
  if(g.arrived) return;
  if(!g.path||g.pi>=g.path.length){
    if(d2g(g,g.tx,g.ty)<0.35*0.35*S2){ g.arrived=true; return; }
    if(g.repl>0){ g.repl-=dt; return; }
    // the way ran out short of the target: try once more from here, and if the
    // target is still out of reach, give the errand up rather than stand at the
    // rim forever (or, worse, count as arrived and work on thin air)
    const wasPartial=g.partial;
    g.ptx=-99; goTo(g,g.tx,g.ty); g.repl=0.6;
    if(!g.path.length||(wasPartial&&g.partial&&g.path.length<=1)){ if(g.partial||!g.path.length&&d2g(g,g.tx,g.ty)>1.5*1.5*S2){ giveUp(g); return; } g.arrived=true; return; }
  }
  const wp=g.path[g.pi];
  const dx=wp[0]-g.x, dy=wp[1]-g.y, dist=Math.hypot(dx,dy);
  if(dist<0.22*S){ g.pi++; if(g.pi>=g.path.length&&d2g(g,g.tx,g.ty)<0.35*0.35*S2) g.arrived=true; return; }
  const ux=dx/dist, uy=dy/dist;
  let sp=gSpeed(g);
  if(g.ride) sp*=g.cart?(PAVE[ci]?1.3:0.6):1.5;   // v9.17: on the deer, half as fast again; the cart runs on the flagstones and drags on open ground
  if(g.swim>0.3) sp*=0.45; else if(wd>0.15) sp*=0.7;
  const grad=(eLerp(g.x+ux*0.6*S,g.y+uy*0.6*S)-eLerp(g.x,g.y))/(0.6*S);
  const wasClimb=g.climb; g.climb=!onBridge&&grad>CLIMB_AT&&!STEPS[ci]; if(g.climb&&!wasClimb) STATS.climbs++;
  if(g.climb){ sp*=0.42; g.climbT+=dt; if(g.climbT>0.75){ g.climbT=0; if(chance(0.6)) sfxHup(g); } }
  else if(!onBridge) sp*=clamp(1-Math.max(0,grad*S)*0.30,0.55,1.15);
  const step=Math.min(dist,sp*dt);
  const nx=g.x+ux*step, ny=g.y+uy*step;
  const ni=I(clamp(Math.round(nx),0,N-1),clamp(Math.round(ny),0,N-1));
  if(ni!==ci){
    // the world may have changed under the plan: check the step is still allowed
    if(!isFinite(stepCost(ci,ni,g.stage!=='baby'))){ g.ptx=-99; goTo(g,g.tx,g.ty); g.stuck+=1; if(g.stuck>6){g.stuck=0;g.arrived=true;g.st='idle';g.decide=0;} return; }
    enterTile(g,ci,ni);
  }
  g.x=clamp(nx,1,N-2); g.y=clamp(ny,1,N-2);
  g.moving=true; g.stuck=0; g.mx=ux; g.my=uy;
  g.walkPh+=dt*sp*3.2/S;

}
/* what a gnome leaves behind as it goes: worn ground, crossing stakes, a count
   of climbs and of bridge crossings */
function enterTile(g,from,to){
  g.tile=to;
  const fb=BRIDGE[from]>0, tb=BRIDGE[to]>0;
  const fw=!fb&&!ICE[from]&&wetD(from)>0.55, tw=!tb&&!ICE[to]&&wetD(to)>0.55;
  // a jump down off a ledge: the hat comes out
  if(!fb&&!tb&&tileH(from)-tileH(to)>JUMP_AT&&g.st!=='float'){ startFloat(g,tileH(from)-tileH(to),false); return; }
  if(!fw&&tw){
    g.swimFrom=from; g.swimN=0; if(g.stage!=='baby') sfxSplash(g); splashFx(g.x,g.y,3);
    // a strong current can take a gnome: streams never, rivers sometimes, torrents nearly always
    const cur=Math.max(FLOW[to],FLOW[from]);
    let pS=clamp01((cur-FLOW_RIVER)/3.2)*0.95; if(g.stage==='child') pS*=1.5; if(g.stage==='elder') pS*=1.2;
    if(chance(pS)) { startSweep(g); return; }
  }
  else if(fw&&tw){ g.swimN++; }
  else if(fw&&!tw&&g.swimFrom!==null){
    if(g.swimN>=0&&g.swimFrom!==to){
      const a=g.swimFrom, b=to;
      marks.push({x:a%N,y:(a/N)|0,t:0,sd:rng()*9}); marks.push({x:b%N,y:(b/N)|0,t:0,sd:rng()*9});
      if(marks.length>60) marks.splice(0,marks.length-60);
    }
    g.swimFrom=null;
  }
  if(!tb&&!fb){
    const dh=Math.abs(E[to]-E[from]);
    if(dh>0.9/S&&!STEPS[to]&&!STEPS[from]&&CLIMBN[to]<250) CLIMBN[to]++;
  }
  if(tb&&!fb){ const b=bridgeAt(to); if(b) b.uses=(b.uses||0)+1; }
}
function wearStep(g,dt){
  if(!g.moving) return;
  const i=I(clamp(Math.round(g.x),0,N-1),clamp(Math.round(g.y),0,N-1));
  if(BRIDGE[i]>0||(!ICE[i]&&wetD(i)>0.15)) return;
  // nothing shows on the ground for this: WEAR is only the village's own count
  // of where the traffic goes, and it is what tells them where stone is worth laying
  WEAR[i]=Math.min(4,WEAR[i]+dt*0.42*S*(1+0.6*Math.min(1,WEAR[i]/1.2)));
}
let wearT=0;
function decayWear(dt){
  wearT+=dt; if(wearT<1) return; wearT-=1;
  for(let i=0;i<NC;i++) if(WEAR[i]>0) WEAR[i]*=WEAR[i]<0.6?0.9975:0.99945;   // a stray track grasses over in minutes; a real path lasts
  for(let k=marks.length-1;k>=0;k--){ marks[k].t+=1; if(marks[k].t>420) marks.splice(k,1); }
}

/* ---------- flora, particles, village ------------------------------------- */
const trees=[], bushes=[], rocks=[], builds=[], parts=[], stumps=[], critters=[], birds=[];
const SPECIES=['round','pine','birch'];
function makeTree(x,y,sp,age){
  const t={x,y,sp,age:age===undefined?rnd(0.6,1):age,sd:rng()*1000,fall:0,marked:0,
    h:sp==='pine'?rnd(40,64):sp==='birch'?rnd(34,50):rnd(30,52),lean:rnd(-0.10,0.10),blobs:[],branches:[]};
  buildTreeShape(t);

}
/* v9.15: three forms a species (t.form, from the seed), so a wood is not one
   tree stamped three hundred times — a round tree is a dome, a tall oval or an
   umbrella; a pine a cone, a slim spire or a broad fir; a birch a tuft, a tall
   wisp or a forked pair. The forms sit in the blob lists the sprite paints. */
function buildTreeShape(t){
  const r=mulberry32((t.sd|0)+1);
  t.branches.length=0; t.blobs.length=0;
  t.form=((t.sd|0)%3+3)%3;
  const F=t.form;
  if(t.sp==='pine'){
    const n=F===1?6+((r()*2)|0):F===2?3+((r()*2)|0):4+((r()*3)|0);
    const wide=F===2?1.25:F===1?0.72:1, top=F===1?0.98:0.96;
    for(let i=0;i<n;i++){ const f=i/(n-1); t.blobs.push({y:-t.h*(0.30+f*(top-0.30)),r:t.h*(0.30-f*0.19)*wide,x:0}); }
  } else if(t.sp==='birch'){
    for(let i=0;i<3;i++) t.branches.push({y:-t.h*(0.55+i*0.13),len:t.h*0.26,a:(r()-0.5)*1.1});
    if(F===1){ for(let i=0;i<5;i++) t.blobs.push({x:(r()-0.5)*t.h*0.34,y:-t.h*(0.62+r()*0.40),r:t.h*(0.13+r()*0.09)}); }                                   // a tall wisp
    else if(F===2){ for(const sd of [-1,1]) for(let i=0;i<3;i++) t.blobs.push({x:sd*t.h*(0.12+r()*0.16),y:-t.h*(0.70+r()*0.26),r:t.h*(0.15+r()*0.08)}); }   // a forked pair
    else { for(let i=0;i<4;i++) t.blobs.push({x:(r()-0.5)*t.h*0.45,y:-t.h*(0.72+r()*0.28),r:t.h*(0.17+r()*0.10)}); }
  } else {
    for(let i=0;i<3;i++) t.branches.push({y:-t.h*(0.52+i*0.14),len:t.h*0.30,a:(r()-0.5)*1.5});
    if(F===1){ for(let i=0;i<6;i++) t.blobs.push({x:(r()-0.5)*t.h*0.42,y:-t.h*(0.62+r()*0.46),r:t.h*(0.17+r()*0.10)}); }                                   // a tall oval
    else if(F===2){ for(let i=0;i<6;i++) t.blobs.push({x:(r()-0.5)*t.h*0.86,y:-t.h*(0.82+r()*0.16),r:t.h*(0.19+r()*0.10)}); }                              // an umbrella: wide and flat on top
    else { for(let i=0;i<5;i++) t.blobs.push({x:(r()-0.5)*t.h*0.62,y:-t.h*(0.70+r()*0.34),r:t.h*(0.20+r()*0.12)}); }
  }
  // the bare crown, for winter: the twigs off each branch and a fan off the top of the trunk
  t.twigs=[];
  if(t.sp!=='pine'){
    for(const b of t.branches){ const n=2+((r()*2)|0); for(let i=0;i<n;i++){ const f=0.45+r()*0.5; t.twigs.push({x:Math.sin(b.a)*b.len*f,y:b.y-Math.cos(b.a)*b.len*0.55*f,len:t.h*(0.10+r()*0.10),a:b.a+(r()-0.5)*1.4}); } }
    const n=4+((r()*3)|0); for(let i=0;i<n;i++){ const a=(i/(n-1)-0.5)*1.9+(r()-0.5)*0.3; t.twigs.push({x:t.h*0.01,y:-t.h,len:t.h*(0.14+r()*0.14),a}); }
  }
}
function seedFlora(){
  trees.length=0;bushes.length=0;rocks.length=0;
  const nT=noise2(world.seed*31+9);
  const per=1/S2;                       // the fine grid has four tiles where v7 had one
  for(let y=1;y<N-1;y++) for(let x=1;x<N-1;x++){
    const i=I(x,y), e=E[i];
    if(WD[i]>0.05||e<=SEA) continue;
    const m=MAT[i], sl=slopeOf(x,y);
    // a tile of land standing alone in the sea is a rock, and gets one, so it does not read as a flat plate in the water
    let seaSides=0; for(const j of [i-1,i+1,i-N,i+N]) if(E[j]<=SEA) seaSides++;
    if(seaSides>=3){ rocks.push({x:x+rnd(-0.15,0.15),y:y+rnd(-0.15,0.15),r:rnd(1.1,1.4),sd:rng()*99,marked:0}); continue; }
    if(((m===SCR||m===ROK)&&rng()<0.36*per*1.3)||(e>=6&&rng()<0.20*per*1.3)||rng()<0.024*per*1.3)
      rocks.push({x:x+rnd(-0.4,0.4),y:y+rnd(-0.4,0.4),r:rnd(0.7,1.3),sd:rng()*99,marked:0});
    if(e>=8||m===ROK||m===SCR||m===SND||sl>1.0) continue;
    const d=clamp01(fbm2(nT,x/S*0.13,y/S*0.13,4)*2.1-0.55);
    if(rng()<d*0.85*per*1.5){
      const n=1+(rng()<0.5?1:0)+(rng()<0.2?1:0);
      for(let k=0;k<n;k++) trees.push(makeTree(x+rnd(-0.32,0.32)*S,y+rnd(-0.32,0.32)*S,pick(SPECIES),rnd(0.6,1)));
    } else if(rng()<0.09*per*1.3){
      bushes.push({x:x+rnd(-0.4,0.4),y:y+rnd(-0.4,0.4),b:rint(2,6),re:rnd(0,14),sc:rnd(.85,1.15),marked:0});
    }
  }
}
/* ---------- wildlife: rabbits in the meadow, deer at the forest edge --------- */
function seedCritters(){
  critters.length=0; birds.length=0;
  let n=0,tries=0;
  while(n<7&&tries<500){ tries++; const x=rint(2*S,N-3*S),y=rint(2*S,N-3*S),i=I(x,y);
    if(MAT[i]!==MEA||wetD(i)>0.05||slopeOf(x,y)>0.6) continue;
    critters.push({k:'rabbit',x:x+rnd(-.3,.3),y:y+rnd(-.3,.3),st:'idle',t:rnd(1,5),tx:x,ty:y,fx:x,fy:y,p:0,z:0,face:1,sd:rng()*9,tone:chance(0.5)?0:1,scare:0}); n++; }
  n=0; tries=0;
  while(n<2&&tries<500){ tries++; const x=rint(3*S,N-4*S),y=rint(3*S,N-4*S),i=I(x,y);
    if((MAT[i]!==MEA&&MAT[i]!==GRS)||wetD(i)>0.05||slopeOf(x,y)>0.7) continue;
    let near=0; for(const t of trees) if(Math.abs(t.x-x)<3*S&&Math.abs(t.y-y)<3*S) near++;
    if(near<2) continue;
    critters.push({k:'deer',x,y,st:'graze',t:rnd(2,6),tx:x,ty:y,face:1,sd:rng()*9,antl:n===0,drank:-1,scare:0,head:0,fed:0,fedDay:-1,tame:false}); n++; }
  // v9.17: two foxes at the wood's edge — they lie up by day and prowl at night
  n=0; tries=0;
  while(n<2&&tries<500){ tries++; const x=rint(3*S,N-4*S),y=rint(3*S,N-4*S),i=I(x,y);
    if((MAT[i]!==MEA&&MAT[i]!==GRS)||wetD(i)>0.05||slopeOf(x,y)>0.7) continue;
    let near=0; for(const t of trees) if(Math.abs(t.x-x)<2.5*S&&Math.abs(t.y-y)<2.5*S) near++;
    if(near<2) continue;
    critters.push({k:'fox',x,y,st:'lieup',t:rnd(2,6),tx:x,ty:y,lx:x,ly:y,face:1,sd:rng()*9,scare:0,head:0,fed:0,fedDay:-1,tame:false,ph:rnd(0,TAU)}); n++; }
}
/* ---------- v9.17: the farmed animals ---------------------------------------
   Rabbits are kept like sheep: a pair caught wild with a basket and penned in
   the fold, bred there, led out to graze by day by a shepherd and brought in at
   dusk, and sheared each spring for their wool. A fox fed fish three days
   running takes to the village and is its dog: on the graze it circles the
   flock and turns the strays, at night it sleeps in its kennel by the fold and
   the wild foxes keep away. A deer fed apples three days running is tame too:
   stabled, ridden with three loads a trip at half as fast again, and once there
   is a cart it pulls six along the flagstones. */
function wildRabbits(){ return critters.filter(c=>c.k==='rabbit'&&!c.fold&&!c.held); }
function theFold(){ return builds.find(b=>b.type==='fold'&&b.done)||null; }
function flockOf(f){ return critters.filter(c=>c.k==='rabbit'&&c.fold===f); }
function theDog(){ return critters.find(c=>c.k==='fox'&&c.tame)||null; }
function theHorse(){ return critters.find(c=>c.k==='deer'&&c.tame&&!c.foal)||null; }
function freeHorse(){ return critters.find(c=>c.k==='deer'&&c.tame&&!c.foal&&!c.rider&&!c.cart&&c.stable&&builds.indexOf(c.stable)>=0&&c.stable.done)||null; }   // v9.19: any grown horse not out already (there can be two)
function foldCap(f){ return 8; }
function inFold(f,x,y){ return x>=f.x0-0.35&&x<=f.x0+f.fw-0.65&&y>=f.y0-0.35&&y<=f.y0+f.fh-0.65; }
/* a spot in the pen for a rabbit, clear of the hutch's tile */
function penSpot(f){ for(let k=0;k<12;k++){ const x=f.x0+rnd(-0.3,f.fw-0.7), y=f.y0+rnd(-0.3,f.fh-0.7); if(f.hutch&&Math.abs(x-f.hutch[0])<0.6&&Math.abs(y-f.hutch[1])<0.6) continue; return [x,y]; } return [f.x,f.y]; }
/* v9.17: up on the deer, and down again; with a cart at the stable the deer is hitched to it instead */
function mount(g,d){ g.ride=d; d.rider=g; d.st='ridden'; d.head=0; d.x=g.x; d.y=g.y; d.cart=null;
  const st=d.stable&&builds.indexOf(d.stable)>=0?d.stable:null; const ct=st&&st.cart&&builds.indexOf(st.cart)>=0&&st.cart.done&&!st.cart.hitched?st.cart:null;
  if(ct){ ct.hitched=g; g.cart=ct; }
  STATS.rides=(STATS.rides||0)+1; if(g.cart) STATS.cartTrips=(STATS.cartTrips||0)+1;
  if(village.rideLog!==T.day){ village.rideLog=T.day; logEv(g.name+(g.cart?' hitched the deer to the cart — six loads a trip, quick along the flagstones':' rode the deer to the store — three loads a trip, and half as fast again')); } }

/* a place on a village's green for one of its own builds (a rack, a woodpile, a well, the lodge, a second fire): a band

   already on it as can be; the lodge turned to face the fire */
function greenSite(type,v,band){
  const c=greenOf(v), need=BT[type], [r0,r1]=band||GREEN_R;
  const on=builds.filter(b=>bvil(b)===v&&!b.tiles&&!b.pt&&(b.type==='rack'||b.type==='pile'||b.type==='well'||b.type==='fire'||b.type==='lodge'||b.type==='lantern')&&Math.hypot(b.x-c.x,b.y-c.y)>0.5).map(b=>Math.atan2(b.y-c.y,b.x-c.x));
  const homes=builds.filter(b=>bvil(b)===v&&(isHome(b)||HOUSE[b.type])).map(b=>Math.atan2(b.y-c.y,b.x-c.x));
  let best=null,bs=-1e9;
  for(let k=0;k<24;k++){ const a=k/24*TAU+0.13*v;
    let gap=Math.PI; for(const t of on){ const d=Math.abs(angDiff(a,t)); if(d<gap) gap=d; }
    let door=Math.PI; for(const t of homes){ const d=Math.abs(angDiff(a,t)); if(d<door) door=d; }   // keep out of a home's way to the fire
    for(let r=r0;r<=r1+0.01;r+=0.5){
      const hx=c.x+Math.cos(a)*r, hy=c.y+Math.sin(a)*r, rot=HOUSE[type]?faceRot(c.x-hx,c.y-hy):0;
      const fw=(HOUSE[type]&&(rot&1))?need.fh:(need.fw||1), fh=(HOUSE[type]&&(rot&1))?need.fw:(need.fh||1);
      const x0=Math.round(hx-(fw-1)/2), y0=Math.round(hy-(fh-1)/2);
      let s=null;
      if(HOUSE[type]) s=houseSiteOK(type,x0,y0,rot);
      else if(siteFree(x0,y0,fw,fh)){ let ok=true; for(let y=y0;y<y0+fh;y++) for(let x=x0;x<x0+fw;x++) if(PREPF[I(x,y)]>=0.5) ok=false; if(ok) s={x0,y0,rot:0}; }
      if(!s) continue;
      const sc=gap*2+Math.min(door,0.5)*1.5-Math.abs(r-(r0+r1)/2)*0.3+h01(k,r*2|0,v)*0.05+(s.gap!==undefined?Math.min(s.gap,3)*0.8:0);
      if(sc>bs){ bs=sc; best=s; } break; }
  }
  return best;
}
/* where something of the farm goes: outside the rings, the nearest good ground beyond them */
function farmSite(fw,fh,v){
  const c=greenOf(v), R0=RING_R[1]+2.5;
  let best=null,bd=1e9;
  for(let r=Math.floor(R0);r<=R0+14;r++){ for(let k=0;k<Math.max(12,Math.round(TAU*r/2));k++){ const a=k/Math.max(12,Math.round(TAU*r/2))*TAU+0.3*v;
      const x0=Math.round(c.x+Math.cos(a)*r-(fw-1)/2), y0=Math.round(c.y+Math.sin(a)*r-(fh-1)/2);
      if(!siteFree(x0,y0,fw,fh)) continue; let ok=true; for(let y=y0-1;y<=y0+fh&&ok;y++) for(let x=x0-1;x<=x0+fw;x++){ if(!inB(x,y)) continue; const i=I(x,y); if(OCC[i]||PREPF[i]>=0.5){ ok=false; break; } }
      if(!ok) continue; const d=r+h01(k,r,7)*0.5; if(d<bd){ bd=d; best={x:x0,y:y0}; } }
    if(best) return best; }
  return null;
}
function tileFree(x,y,maxSlope){
  if(!inB(x,y)||x<2*S||y<2*S||x>=N-2*S||y>=N-2*S) return false;
  const i=I(x,y);
  if(wetD(i)>0.08||E[i]<=SEA+0.6||MAT[i]===ROK||BRIDGE[i]>0||DAM[i]||OCC[i]||PAVE[i]) return false;
  for(const b of builds){ if(b.tiles||b.pt) continue; if(Math.round(b.x)===x&&Math.round(b.y)===y) return false; if(b.dx===x&&b.dy===y) return false; }
  return slopeOf(x,y)<=(maxSlope||0.75);
}
/* a footprint with its top-left tile at (x0,y0); the door is the tile just
   below the footprint's first column */
function fpTiles(x0,y0,fw,fh){ const out=[]; for(let y=y0;y<y0+fh;y++) for(let x=x0;x<x0+fw;x++) out.push(I(x,y)); return out; }
/* how uneven the ground is under and round a footprint: the spread of heights
   over the footprint plus a tile all round it (the yard, the door, the eaves) */
function siteSpread(x0,y0,fw,fh){
  let lo=1e9,hi=-1e9;
  for(let y=y0-1;y<y0+fh+1;y++) for(let x=x0-1;x<x0+fw+1;x++){ if(!inB(x,y)) continue; const e=E[I(x,y)]; if(e<lo)lo=e; if(e>hi)hi=e; }
  return hi-lo;
}
/* v9.14: a site is good if the builders can make it so — every tile of the
   footprint within EARTH of their mean (cut or banked by the 'level' pieces),
   the ground round it not falling away by more than SITE_SPREAD, the door
   within reach of the floor. Before, a footprint had to lie within 0.45 of
   flat on its own, so a slope the gnomes could easily have cut a platform into
   was refused. */
const SITE_SPREAD=2.0;
function siteFree(x0,y0,fw,fh){
  let lo=1e9,hi=-1e9,m=0,n=0;
  // a home keeps a little yard round the fire clear, so the gathering stays in view
  if(fw*fh>1) for(const b of builds){ if(b.type!=='fire') continue; if(b.x>=x0-2.5&&b.x<=x0+fw+1.5&&b.y>=y0-2.5&&b.y<=y0+fh+1.5) return false; }
  for(let y=y0;y<y0+fh;y++) for(let x=x0;x<x0+fw;x++){ if(!tileFree(x,y,1.0)) return false; const e=E[I(x,y)]; if(e<lo)lo=e; if(e>hi)hi=e; m+=e; n++; }
  m/=n;
  if(hi-m>EARTH||m-lo>EARTH) return false;
  if(fw*fh>1&&siteSpread(x0,y0,fw,fh)>SITE_SPREAD) return false;     // and the ground round it must not fall away
  const dx=x0, dy=y0+fh;                       // the door tile must be dry ground too
  if(!inB(dx,dy)) return false;
  const di=I(dx,dy);
  if(wetD(di)>0.15||OCC[di]||BRIDGE[di]>0||E[di]<=SEA+0.3) return false;
  if(Math.abs(E[di]-m)>EARTH+0.2) return false;
  return true;
}
function findSite(fw,fh){
  const c=villagePos();
  for(let r=1;r<16*S;r++){
    const cand=[];
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      const x=Math.round(c.x)+dx, y=Math.round(c.y)+dy;
      if(siteFree(x,y,fw,fh)) cand.push({x,y});
    }
    if(cand.length) return cand[(rng()*cand.length)|0];
  }
  return null;
}
function clearTile(x,y,keepTrees){
  let got=0;
  if(!keepTrees) for(let i=trees.length-1;i>=0;i--){
    const t=trees[i];
    if(Math.round(t.x)===x&&Math.round(t.y)===y){ got+=t.age>=1?3:1; trees.splice(i,1); }
  }
  for(let i=bushes.length-1;i>=0;i--){ const b=bushes[i]; if(Math.round(b.x)===x&&Math.round(b.y)===y) bushes.splice(i,1); }
  for(const r of rocks){ if(Math.round(r.x)===x&&Math.round(r.y)===y){ r.x+=rnd(0.8,1.4)*(chance(.5)?1:-1); r.y+=rnd(0.8,1.4)*(chance(.5)?1:-1); } }
  if(got) store.wood+=got;
}
/* the ground of one tile brought to a level by the gnomes' spades: the approach
   to a bridge, so the deck lands flat at both ends */
function levelTile(i,target,force){
  const x=i%N, y=(i/N)|0;
  if(BRIDGE[i]>0||DAM[i]||(OCC[i]&&!force)) return;   // force: a footprint's own tiles, levelled by their builder (v9.14)
  E[i]=target; E0[i]=target; SOIL[i]=Math.max(SOIL[i],0.3);
  for(const t of trees){ if(!t.fall&&Math.round(t.x)===x&&Math.round(t.y)===y){ t.fall=0.001; t.fallDir=chance(.5)?1:-1; t.marked=0; } }
  for(let k=bushes.length-1;k>=0;k--){ const bb=bushes[k]; if(Math.round(bb.x)===x&&Math.round(bb.y)===y) bushes.splice(k,1); }
  for(const r of rocks){ if(Math.round(r.x)===x&&Math.round(r.y)===y){ r.x+=rnd(0.8,1.4)*(chance(.5)?1:-1); r.y+=rnd(0.8,1.4)*(chance(.5)?1:-1); } }
  // the dry ground beside it is eased halfway, so the platform is banked, not walled
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(!inB(nx,ny)||nx<1||ny<1||nx>=N-1||ny>=N-1) continue; const j=I(nx,ny);
    if(OCC[j]||BRIDGE[j]>0||DAM[j]||wetD(j)>0.15||E[j]<=SEA+0.4||STEPS[j]) continue;
    if(Math.abs(E[j]-target)>0.45){ E[j]=lerp(E[j],target,0.5); E0[j]=E[j]; markWet(j); } }
  markWet(i); puff(x,y,2); rebuildSurface();
}
/* the earthwork at a dam's ends: each bank tile the wall runs into is made a
   flat platform DAM_BANK above the wall's crest — banked up where the bank is
   low, cut down where it is high (damRun has already kept both within EARTH)
   — so the wall runs into solid ground and the pond stays behind it */
function damApproach(b,P){
  if(!b.ends) return;
  for(const [ex,ey] of b.ends){
    const ti=I(ex,ey); if(OCC[ti]||BRIDGE[ti]>0||DAM[ti]) continue;
    const target=b.wall+DAM_BANK;
    if(Math.abs(E[ti]-target)<=0.05) continue;
    for(const tr of trees){ if(tr.fall) continue; if(Math.round(tr.x)===ex&&Math.round(tr.y)===ey) P.push(pc(null,'clear',[tr.x,tr.y],{tree:tr})); }
    P.push(pc(null,'level',[ex,ey],{ti,target,n:0}));
  }
}
/* the earthwork at a bridge's ends, as pieces of its plan: each end tile is
   brought level with the deck, and beyond the lower end the ground is banked
   up in a ramp of gentle steps until the natural ground catches it up */
function approachPieces(b,P){
  if(!b.app||b.app.length<2) return;
  const D=b.deck-0.06, ends=[[b.app[0],-b.ux,-b.uy],[b.app[1],b.ux,b.uy]];
  for(const [ei,sx,sy] of ends){
    const seen=[];
    if(Math.abs(E[ei]-D)>0.05&&!OCC[ei]) seen.push({ti:ei,target:D});
    let x=ei%N+sx, y=((ei/N)|0)+sy;
    for(let k=1;k<=3;k++,x+=sx,y+=sy){
      if(!inB(x,y)||x<1||y<1||x>=N-1||y>=N-1) break;
      const ti=I(x,y); if(OCC[ti]||BRIDGE[ti]>0||DAM[ti]||!land(ti)||E[ti]<=SEA+0.4) break;
      // the first tile beyond is flat with the end (a landing two tiles long); further out a ramp of gentle steps, where the ground is lower
      const want=k===1?D:D-0.45*(k-1);
      if(k===1){ if(Math.abs(E[ti]-want)<=0.05) continue; if(E[ti]>want+0.6) break; seen.push({ti,target:want}); continue; }
      if(E[ti]>=want-0.05) break;
      seen.push({ti,target:want});
    }
    for(const q of seen){
      for(const tr of trees){ if(tr.fall) continue; if(Math.round(tr.x)===q.ti%N&&Math.round(tr.y)===((q.ti/N)|0)) P.push(pc(null,'clear',[tr.x,tr.y],{tree:tr})); }
      P.push(pc(null,'level',[q.ti%N,(q.ti/N)|0],{ti:q.ti,target:q.target,n:0}));
    }
  }
}
/* set a building down on its footprint: clear it, wall it off, and fix the
   level it will stand at. v9.14 (Jed: "gnomes should be able to slightly lower
   or raise terrain for their buildings"): the footprint is no longer snapped
   flat here. Its level is the mean of its ground, and the builders cut and
   bank each tile to it with a spade before the first stone goes down (the
   'level' pieces makePlan puts at the head of every footprint's plan, the door
   tile with them), each tile by up to EARTH of a level — the same earthwork a
   bridge's landings and a dam's ends get. The tile round it is eased by the
   levelling itself (levelTile banks the neighbours of every tile it moves). */
function placeBuild(b){
  if(!b.fp) return;
  let m=0; for(const i of b.fp) m+=E[i]; m/=b.fp.length;
  const staged=!!STAGED[b.type];                                   // the gnomes fell the trees themselves on a staged site
  for(const i of b.fp){ clearTile(i%N,(i/N)|0,staged); OCC[i]=1; }
  if(!staged) for(const i of b.fp){ E[i]=m; E0[i]=m; SOIL[i]=Math.max(SOIL[i],0.3); }   // nothing is unstaged since v9.4; kept for a harness that places by hand
  b.z0=m;
  rebuildSurface();
}
function removeBuild(b){
  const k=builds.indexOf(b); if(k<0) return;
  if(b.fp) for(const i of b.fp) OCC[i]=0;
  for(const g of gnomes){
    if(g.inside===b) leaveBuild(g);
    if(g.restIn===b){ g.restIn=null; }
    if(g.home===b) g.home=null;
    if(g.project===b) g.project=null;
    // v9.10: whoever was working for it turns to whatever is urgent. A gnome in
    // the middle of a stroke of work keeps its job (the axe is in the air) and
    // only loses the site, so what it is carrying goes to the pile instead
    if(g.job&&(g.job.b===b||g.job.bed===b||g.job.site===b)){
      if(BUSY[g.st]){ if(g.job.b===b) g.job.b=null; if(g.job.site===b) g.job.site=null; if(g.job.bed===b) g.job.bed=null; }
      else { clearMarks(g); g.job=null; if(g.st!=='sleep'){ g.st='idle'; g.decide=0.3; } }
    }
  }
  builds.splice(k,1); plotEnd(b,true);
  if(village.project===b) village.project=null; if(village.project2===b) village.project2=null;
}
function enterBuild(g,b){
  if(g.inside) return;
  g.inside=b; b.inN=(b.inN||0)+1; g.x=b.x; g.y=b.y; g.path=null; g.arrived=true; g.moving=false; g.swim=0;
}
function leaveBuild(g){
  const b=g.inside; if(!b) return;
  g.inside=null; b.inN=Math.max(0,(b.inN||0)-1);
  const fn=HOUSE[b.type]?houseFrame(b).RN(0,1):[0,1], j=rnd(-0.2,0.2), o=rnd(0,0.3);
  g.x=b.dx+fn[1]*j+fn[0]*o; g.y=b.dy+fn[0]*j+fn[1]*o; g.gz=eLerp(g.x,g.y); g.path=null; g.arrived=true; g.ptx=-99;
}
function mkBuild(t,x0,y0,rot){
  const need=BT[t], r=(rot|0)&3, turn=HOUSE[t]&&(r&1), fw=turn?(need.fh||1):(need.fw||1), fh=turn?(need.fw||1):(need.fh||1);
  const b={type:t,x:x0+(fw-1)/2,y:y0+(fh-1)/2,x0,y0,fw,fh,fp:fpTiles(x0,y0,fw,fh),dx:x0,dy:y0+fh,
    prog:0,work:need.work,done:false,beds:need.beds||0,occ:0,ph:rnd(0,TAU),inN:0};
  // v9.20: a house may be turned to face the green; its door is the tile before the middle of its front wall
  if(HOUSE[t]){ b.rot=r; const d=houseTile(b,HOUSE[t].door,HOUSE[t].V+0.5); b.dx=d[0]; b.dy=d[1]; }
  b.sx=b.dx; b.sy=b.dy;
  return b;
}
/* v9.20: the kinds of house — a house a household lives in (the cabin and the craft homes), and the halls and workplaces */
function isCabin(b){ const h=b&&HOUSE[b.type]; return !!(h&&h.beds>0); }
function countHomes(){ let n=0; for(const b of builds) if(b.done&&isCabin(b)) n++; return n; }
function houseLabel(b){ return HOUSE[b.type]?HOUSE[b.type].label.toLowerCase():b.type; }
/* what the village builds for itself; homes are the households' own affair */
function nextType(){
  if(!hasB('fire')) return 'fire';
  if(!hasB('pile')) return 'pile';
  const pop=gnomes.length;
  if(!hasB('rack')&&countB('tent',true)+countHomes()>0) return 'rack';
  if(countB('fire',true)<Math.ceil(pop/7)) return 'fire';
  if(countB('rack',true)<Math.ceil(pop/8)) return 'rack';
  if(countB('pile',true)<Math.ceil(pop/10)) return 'pile';
  return null;
}
/* where a gnome sleeps: its own home; a child, its parents' cabin; otherwise by the fire */
function homeBed(g){
  const h=homeOf(g);
  if(h&&h.beds&&h.occ<h.beds) return h;
  if(g.stage==='baby'||g.stage==='child'){ for(const p of (g.parents||[])){ const ph=p&&homeOf(p); if(ph&&ph.beds&&ph.occ<ph.beds) return ph; } }
  return null;
}
function costOf(b){ return b.cost||BT[b.type]; }
function planVillage(){
  // v9.19 (Jed: "bridges built timeously"): a crossing at the head of the queue does not wait its turn behind a windmill or a
  // well — from six gnomes a second work party starts it at once (village.project2), while the first carries on
  if(village.project&&!village.project2&&gnomes.length>=6&&village.queue.length&&isCrossing(village.queue[0])){
    const q=village.queue.shift();
    if(q.tiles&&q.type==='logbridge'&&q.tiles.filter(i=>wetDrawn(i)).length*2<q.tiles.length) return;
    placeBuild(q); stageProject(q); builds.push(q); village.project2=q; return;
  }
  // v9.20: the hamlet's own woodpile and rack go to the head of the queue once its fire is lit (the village raises them for it)
  if(villages[1]) for(const t of ['pile','rack']){ if(builds.some(o=>o.type===t&&bvil(o)===1)||village.queue.some(q=>q.type===t&&bvil(q)===1)) continue;
    const gs=greenSite(t,1); if(!gs) continue; const b=mkBuild(t,gs.x0,gs.y0); b.vil=1; b.why='on the hamlet\u2019s green'; placeBuild(b); village.queue.unshift(b);
    logEv('The village is putting up a '+BT[t].label.toLowerCase()+' on the hamlet\u2019s green',b); }
  if(village.project) return;
  // what the gnomes' own habits have asked for comes first
  if(village.queue.length){
    const q=village.queue[0], need=costOf(q);
    if(q.tiles&&q.type==='logbridge'&&q.tiles.filter(i=>wetDrawn(i)).length*2<q.tiles.length){ village.queue.shift(); return; }   // the water went away (v9.14: a span now takes in the drawn margins, so one of them drying is not that)
    // raised piece by piece from what is carried in
    village.queue.shift(); placeBuild(q); stageProject(q);
    builds.push(q); village.project=q; village.wait=0;
    return;
  }
  const t=nextType(); if(!t) return;
  const need=BT[t];
  // v9.20: on the green round the fire — the first of each kind close in, a second further out between the rings, so the
  // homes on that side have a fire, a rack and a woodpile of their own to go to
  let s=null;
  if(villages[0]){ const gs=greenSite(t,0,countB(t)>=1?[7.5,9.5]:GREEN_R); if(gs) s={x:gs.x0,y:gs.y0}; }
  if(!s) s=findSite(need.fw||1,need.fh||1); if(!s) return;
  const b=mkBuild(t,s.x,s.y); b.vil=0;
  placeBuild(b); stageProject(b);
  builds.push(b); village.project=b;
}
/* what the isle is short of: every planning tick, each site that wants a
   material the store cannot give adds its wait; the village reads these to
   know when a mill is worth the work */
function tallyShortfall(){
  const seen=[];
  const sites=villageSites();
  for(const g of gnomes){ const p=ownsProject(g); if(p&&sites.indexOf(p)<0) sites.push(p); }
  for(const b of sites){ if(!b.plan) continue; for(const m of ['wood','stone','fibre']) if(siteWant(b,m)>0&&store[m]-reserveOf(m)<1) village.short[m]+=1.2; }
  if(T.cold>0.3&&store.wood<reserveOf('wood')) village.short.wood+=1.2;      // a cold night with the pile bare counts too
}
function mkProj(type,x,y,sx,sy,extra){
  const need=BT[type];
  const b=Object.assign({type,x,y,sx,sy,prog:0,work:need.work,done:false,beds:0,occ:0,ph:rnd(0,TAU)},extra||{});
  if(need.fw&&!b.fp){ b.x0=x; b.y0=y; b.fw=need.fw; b.fh=need.fh; b.fp=fpTiles(x,y,need.fw,need.fh); b.dx=sx; b.dy=sy; }
  return b;
}
/* ---------- what the gnomes' habits build ---------------------------------- */
function nearBuild(x,y,r,types){
  for(const b of builds){ if(types.indexOf(b.type)<0) continue; if(Math.abs(b.x-x)<=r&&Math.abs(b.y-y)<=r) return b; }
  for(const b of village.queue){ if(types.indexOf(b.type)<0) continue; if(Math.abs(b.x-x)<=r&&Math.abs(b.y-y)<=r) return b; }
  return null;
}
function land(i){ return wetD(i)<0.3&&BRIDGE[i]===0&&!OCC[i]; }
/* where the mill goes: the nearest tile to either end of the dam, up to four
   out, at the water's edge, not built on, damp at most — a steep bank will do,
   the builders cut the mill its platform */
function millSpot(ends){
  let spot=null,bs=1e9;
  for(const[ex,ey] of ends){ for(let r=0;r<=4;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue; const x=ex+dx,y=ey+dy; if(!inB(x,y)||x<2*S||y<2*S||x>=N-2*S||y>=N-2*S) continue; const j=I(x,y);
    if(wetD(j)>0.2||E[j]<=SEA+0.6||MAT[j]===ROK||BRIDGE[j]>0||DAM[j]||OCC[j]||PAVE[j]||slopeOf(x,y)>1.8) continue;
    let taken=false; for(const b of builds){ if(b.tiles||b.pt) continue; if((Math.round(b.x)===x&&Math.round(b.y)===y)||(b.dx===x&&b.dy===y)){ taken=true; break; } } if(taken) continue;
    if(!wheelWater(x,y)) continue; const s=r*2+slopeOf(x,y)*0.4+wetD(j)-(wheelFlow(x,y)>FLOW_STREAM?1.5:0); if(s<bs){bs=s;spot=[x,y];} } }   // v9.14: below the dam, where the spill runs, before the still pond above it

   landings and whatever its piers stand on, a dam's bed, a run of flagstones,
   a flight of steps — are checked against the ground as it was when the stroke

  if(b.ends) for(const [x,y] of b.ends) if(inB(x,y)) out.push(I(x,y));

/* v9.20: the plot round a building — which kinds get a yard levelled all round, the tiles a tile out from the footprint, and

const PREP_RING={cabin:1,lodge:1,fisher:1,miner:1,shepherd:1,farmer:1,woodcutter:1,workshop:1,boathouse:1,tent:1,windmill:1,stable:1,well:1};
function ringTiles(b){ const out=[]; for(let y=b.y0-1;y<=b.y0+b.fh;y++) for(let x=b.x0-1;x<=b.x0+b.fw;x++){ if(x>=b.x0&&x<b.x0+b.fw&&y>=b.y0&&y<b.y0+b.fh) continue; if(!inB(x,y)||x<1||y<1||x>=N-1||y>=N-1) continue; out.push(I(x,y)); } return out; }
function prepOK(i){ return !OCC[i]&&BRIDGE[i]===0&&!DAM[i]&&wetD(i)<0.1&&!PAVE[i]&&!STEPS[i]&&E[i]>SEA+0.5&&MAT[i]!==ROK&&PREPF[i]<0.5; }
/* the plot comes up raked bare the moment the work starts, and goes back to grass (a trodden yard round a home) after */
function plotStart(b){ if(!b.plot||b.plotOn) return; b.plotOn=true; for(const i of b.plot){ PREP[i]=1; PREPF[i]=1; } }
function plotEnd(b,gone){ if(!b.plot) return; const fl=gone?0:(isCabin(b)||b.type==='lodge'?0.32:0); for(const i of b.plot){ if(b.fp&&b.fp.indexOf(i)>=0) PREPF[i]=0; else PREPF[i]=fl; } }
let prepT=0;
function prepFade(dt){ prepT+=dt; if(prepT<1) return; const k=prepT/(DAYLEN*2); prepT=0; for(let i=0;i<NC;i++){ const p=PREP[i]; if(p>PREPF[i]) PREP[i]=Math.max(PREPF[i],p-k); else if(p<PREPF[i]&&PREPF[i]<1) PREP[i]=PREPF[i]; } }
/* v9.20: a house of any kind, piece by piece: the stone footing all round, the stone walls, the log or board walls course
   by course, the gables, the ridge and the roof's covering (shingles; thatch is reeds, slate is stone), the chimney, the
   windows and the door — then what belongs to the craft: the porch, the nets and the jetty, the hurdles, the stack, the
   bench, the loft door, the slip and the boat on it */
function housePlan(b,P){
  const sp=HOUSE[b.type], F=houseFrame(b), U=sp.U, V=sp.V;
  const at=(u,v)=>{ const q=F.R(u,v); return standAt(b,q[0],q[1]); };
  const sides=[at(0,V+0.5),at(U+0.5,0),at(0,-V-0.5),at(-U-0.5,0)];   // front, right, back, left
  const mOf=(f)=>sp.walls[f].m;
  for(let k=0;k<4;k++) P.push(pc('stone','found',sides[k],{n:k}));
  const stoneW=[0,1,2,3].filter(f=>mOf(f)==='stone'), stoneP=sp.stoneP||3;
  for(let k=0;k<stoneW.length*stoneP;k++) P.push(pc('stone','chimwall',sides[stoneW[k%stoneW.length]],{n:k}));
  const logW=[0,1,2,3].filter(f=>mOf(f)==='log'||mOf(f)==='plank');
  if(logW.length){ const nc=(sp.courses||4)*2; for(let k=0;k<nc;k++) P.push(pc('wood','wall',sides[logW[k%logW.length]],{n:k})); }
  for(const f of [1,3]) if(mOf(f)==='log'||mOf(f)==='plank') for(let k=0;k<2;k++) P.push(pc('wood','gable',sides[f],{n:k}));
  P.push(pc('wood','ridge',sides[2],{n:0}));
  const rm=sp.roof==='thatch'?'fibre':sp.roof==='slate'?'stone':'wood';
  for(let k=0;k<4;k++) P.push(pc(rm,'shingle',sides[k<2?0:2],{n:k}));
  if(sp.chim){ P.push(pc('stone','chim',sides[1],{n:0})); P.push(pc('stone','chim',sides[1],{n:1})); }
  let nWin=0; for(const w of sp.walls) for(const q of w.win) nWin=Math.max(nWin,q[1]+1);
  for(let n=0;n<nWin;n++){ const f=[0,1,2,3].find(q=>sp.walls[q].win.some(x=>x[1]===n)); P.push(pc('wood','window',sides[f],{n})); }
  if(sp.doorW>0) P.push(pc('wood','door',at(sp.door,V+0.5),{n:0}));
  if(sp.porch) for(let k=0;k<2;k++) P.push(pc('wood','porch',at(0,V+1.5),{n:k}));
  if(sp.nets){ P.push(pc('fibre','net',sides[0],{n:0})); if(b.jetty) for(let k=0;k<b.jetty.len;k++) P.push(pc('wood','jetty',[b.jetty.sx,b.jetty.sy],{n:k})); }
  if(sp.hurdles) for(let k=0;k<2;k++) P.push(pc('wood','hurdle',sides[0],{n:k}));
  if(sp.stack) for(let k=0;k<2;k++) P.push(pc('wood','stack',sides[1],{n:k}));
  if(sp.bench) for(let k=0;k<2;k++) P.push(pc('wood','bench',sides[0],{n:k}));
  if(sp.loft) P.push(pc('wood','loft',sides[1],{n:0}));
  if(sp.slip){ for(let k=0;k<2;k++) P.push(pc('wood','slip',sides[0],{n:k})); for(let k=0;k<2;k++) P.push(pc('wood','ribs',sides[0],{n:k})); }
}
function lerp2(a,c,f){ return [lerp(a[0],c[0],f),lerp(a[1],c[1],f)]; }
/* a standing point for the builder beside a piece: the nearest open tile to
   (x,y) that is not part of the footprint */
function standAt(b,x,y){
  const rx=Math.round(x), ry=Math.round(y);
  const ok=(tx,ty)=>{ if(!inB(tx,ty)||tx<1||ty<1||tx>=N-1||ty>=N-1) return false; const i=I(tx,ty); if(OCC[i]||wetD(i)>0.3||BRIDGE[i]>0) return false; if(b.fp&&b.fp.indexOf(i)>=0) return false; return true; };
  if(ok(rx,ry)) return [x,y];
  for(let r=1;r<=3;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue; if(ok(rx+dx,ry+dy)) return [rx+dx,ry+dy]; }
  return [x,y];
}
function makePlan(b){
  const t=b.type, P=[];
  // the ground is cleared first: every tree on the footprint, and round a cabin a tile beyond it, is felled by a gnome (its log comes to the site)
  if(b.fp){ const m=HOUSE[t]?1:0; for(const tr of trees){ if(tr.fall) continue; const tx=Math.round(tr.x), ty=Math.round(tr.y); if(tx>=b.x0-m&&tx<b.x0+b.fw+m&&ty>=b.y0-m&&ty<b.y0+b.fh+m) P.push(pc(null,'clear',[tr.x,tr.y],{tree:tr})); } }
  // v9.14: the ground itself. Every tile of a footprint is cut or banked to the
  // level the thing stands at (placeBuild's mean), and the door tile with it,
  // by a gnome with a spade — each a piece of the plan, before any stone
  if(b.fp&&b.z0!==undefined){
    for(const i of b.fp){ if(Math.abs(E[i]-b.z0)>0.05) P.push(pc(null,'level',standAt(b,i%N,(i/N)|0),{ti:i,target:b.z0,n:0,force:true})); }
    if(b.dx!==undefined&&inB(b.dx,b.dy)&&t!=='garden'&&t!=='slipway'){ const di=I(b.dx,b.dy); if(!OCC[di]&&BRIDGE[di]===0&&!DAM[di]&&wetD(di)<0.15&&E[di]>SEA+0.3&&Math.abs(E[di]-b.z0)>0.2) P.push(pc(null,'level',standAt(b,b.dx,b.dy),{ti:di,target:b.z0,n:0})); }
    // v9.20 (Jed: "prepare the ground level the area around it as well … a different colour for a build"): a house, a
    // tent, a mill, a stable or a well gets a yard a tile wide all round, cut or banked level with its floor where the
    // ground is open and within reach of it; the footprint and that yard are the plot, raked bare while it goes up
    b.plot=b.fp.slice();
    if(PREP_RING[t]){ const done=new Set(P.filter(q=>q.k==='level').map(q=>q.ti)), work=[];
      for(const i of ringTiles(b)){ if(b.plot.indexOf(i)>=0||!prepOK(i)) continue; b.plot.push(i); if(done.has(i)) continue;
        const d=Math.abs(E[i]-b.z0); if(d>0.15&&d<=EARTH+0.3) work.push(i); }
      // a spadeful of work is two tiles side by side where it can be (what is nearly level already is only raked)
      for(let k=0;k<work.length;k++){ const i=work[k], j=work[k+1]; const pair=j!==undefined&&Math.abs(i%N-j%N)+Math.abs(((i/N)|0)-((j/N)|0))===1;
        P.push(pc(null,'level',standAt(b,i%N,(i/N)|0),pair?{ti:i,ti2:j,target:b.z0,n:0,ring:true}:{ti:i,target:b.z0,n:0,ring:true})); if(pair) k++; } }
  }
  // a bridge that lands over dry ground fells what stands on it; and the approaches are dug and filled to the deck's level, first thing
  if(b.tiles&&(t==='logbridge'||t==='plankbridge'||t==='stonebridge')){
    for(const tr of trees){ if(tr.fall) continue; const ti=I(clamp(Math.round(tr.x),0,N-1),clamp(Math.round(tr.y),0,N-1)); if(b.tiles.indexOf(ti)>=0) P.push(pc(null,'clear',[tr.x,tr.y],{tree:tr})); }
    approachPieces(b,P);
  }

  if(HOUSE[t]){
    housePlan(b,P);
  } else if(t==='tent'){
    const cx=b.x, Y0=b.y0, Y1=b.y0+b.fh-1;
    P.push(pc('wood','pole',standAt(b,cx-1,Y0),{n:0})); P.push(pc('wood','pole',standAt(b,cx+1,Y1),{n:1}));
    P.push(pc('wood','ridge',standAt(b,cx+1,(Y0+Y1)/2),{n:0}));
    for(let k=0;k<3;k++) P.push(pc('fibre','cloth',standAt(b,k%2?cx+1:cx-1,Y0+(Y1-Y0)*k/2),{n:k}));
    P.push(pc('wood','peg',standAt(b,cx-1,Y1+1),{n:0})); P.push(pc('wood','peg',standAt(b,cx+1,Y1+1),{n:1}));
  } else if(t==='rack'){
    P.push(pc('wood','post',standAt(b,b.x-1,b.y),{n:0})); P.push(pc('wood','post',standAt(b,b.x+1,b.y),{n:1}));
    P.push(pc('wood','bar',standAt(b,b.x,b.y+1),{n:0})); P.push(pc('wood','bar',standAt(b,b.x,b.y+1),{n:1}));
    P.push(pc('fibre','line',standAt(b,b.x-1,b.y+1),{n:0})); P.push(pc('fibre','line',standAt(b,b.x+1,b.y+1),{n:1}));
  } else if(t==='fire'){
    const ring=rocks.length>0||store.stone>0;
    if(ring){ P.push(pc('stone','ring',standAt(b,b.x-1,b.y),{n:0})); P.push(pc('stone','ring',standAt(b,b.x+1,b.y),{n:1})); }
    for(let k=0;k<3;k++) P.push(pc('wood','log',standAt(b,b.x+(k-1),b.y+1),{n:k}));
  } else if(t==='pile'){
    for(let k=0;k<2;k++) P.push(pc('wood','log',standAt(b,b.x+(k?1:-1),b.y+1),{n:k}));
  } else if(t==='lantern'){
    P.push(pc('wood','post',standAt(b,b.x,b.y+1),{n:0})); P.push(pc('fibre','lamp',standAt(b,b.x,b.y+1),{n:0}));
  } else if(t==='logbridge'){
    // out from the near bank: where the span wants a pier, its two stones go down first; then the tile's logs, laid from the last tile finished
    const L=b.tiles.length, [ax,ay]=b.ends[0];
    for(let k=0;k<L;k++){ const ti=b.tiles[k]; const from=k===0?[ax,ay]:[b.tiles[k-1]%N,(b.tiles[k-1]/N)|0];
      if(b.piers&&b.piers.indexOf(k)>=0) for(let q=0;q<2;q++) P.push(pc('stone','pier',from,{n:q,ti,tk:k}));
      for(let q=0;q<BT.logbridge.w;q++) P.push(pc('wood','deck',from,{n:q,ti,tk:k})); }
  } else if(t==='plankbridge'&&!b.up){
    // a plank bridge from scratch (after a spate): out from the near bank, each tile's pier stones, then its planks and rail; footings and the ropes last
    const L=b.tiles.length, [ax,ay]=b.ends[0], [bx,by]=b.ends[1];
    P.push(pc('stone','footing',[ax,ay],{n:0,ti:I(ax,ay),tk:-1}));
    for(let k=0;k<L;k++){ const ti=b.tiles[k], x=ti%N, y=(ti/N)|0; const from=k===0?[ax,ay]:[b.tiles[k-1]%N,(b.tiles[k-1]/N)|0];
      if(b.piers&&b.piers.indexOf(k)>=0) for(let q=0;q<2;q++) P.push(pc('stone','pier',from,{n:q,ti,tk:k}));
      for(let q=0;q<3;q++) P.push(pc('wood','plank',from,{n:q,ti,tk:k})); P.push(pc('wood','rail',[x,y],{n:0,ti,tk:k})); }
    P.push(pc('stone','footing',[bx,by],{n:1,ti:I(bx,by),tk:L}));
    const mid=b.tiles[L>>1]; for(let q=0;q<2;q++) P.push(pc('fibre','rope',[mid%N,(mid/N)|0],{n:q,ti:mid,tk:L>>1}));
  } else if(t==='plankbridge'){
    // over the old log deck, from the near bank: a stone footing, three planks and a rail post a tile, the far footing, then the rope rails
    const u=b.up, L=u.tiles.length, [ax,ay]=u.ends[0], [bx,by]=u.ends[1];
    P.push(pc('stone','footing',[ax,ay],{n:0,ti:I(ax,ay),tk:-1}));
    for(let k=0;k<L;k++){ const ti=u.tiles[k], x=ti%N, y=(ti/N)|0; const from=k===0?[ax,ay]:[u.tiles[k-1]%N,(u.tiles[k-1]/N)|0];
      for(let q=0;q<3;q++) P.push(pc('wood','plank',from,{n:q,ti,tk:k})); P.push(pc('wood','rail',[x,y],{n:0,ti,tk:k})); }
    P.push(pc('stone','footing',[bx,by],{n:1,ti:I(bx,by),tk:L}));
    const mid=u.tiles[L>>1]; for(let q=0;q<2;q++) P.push(pc('fibre','rope',[mid%N,(mid/N)|0],{n:q,ti:mid,tk:L>>1}));
  } else if(t==='ropebridge'){
    // two anchor stones on the near rim, the ropes thrown across and made fast, then a plank a tile out over the drop (each laid from the last), and the far anchors
    const L=b.tiles.length, [ax,ay]=b.ends[0], [bx,by]=b.ends[1];
    for(let q=0;q<2;q++) P.push(pc('stone','anchor',[ax,ay],{n:q,ti:I(ax,ay),tk:-1}));
    for(let q=0;q<2;q++) P.push(pc('fibre','rope',[ax,ay],{n:q,ti:I(ax,ay),tk:-1}));
    for(let k=0;k<L;k++){ const ti=b.tiles[k]; const from=k===0?[ax,ay]:[b.tiles[k-1]%N,(b.tiles[k-1]/N)|0]; P.push(pc('wood','plank',from,{n:0,ti,tk:k})); }
    const last=[b.tiles[L-1]%N,(b.tiles[L-1]/N)|0];

  } else if(t==='stonebridge'){

    // turn the arch over and the voussoirs laid on it, and when the whole arch

    const L=b.tiles.length, [ax,ay]=b.ends[0], [bx,by]=b.ends[1];
    for(let q=0;q<2;q++) P.push(pc('stone','footing',[ax,ay],{n:q,ti:I(ax,ay),tk:-1}));
    for(let k=0;k<L;k++){ const ti=b.tiles[k], from=k===0?[ax,ay]:[b.tiles[k-1]%N,(b.tiles[k-1]/N)|0];

    for(let q=0;q<2;q++) P.push(pc('stone','footing',[bx,by],{n:2+q,ti:I(bx,by),tk:L}));
    for(let k=0;k<L;k++){ const ti=b.tiles[k]; P.push(pc('stone','parapet',[ti%N,(ti/N)|0],{n:k,ti,tk:k})); }
  } else if(t==='dam'){

    const L=b.tiles.length, [ax,ay]=b.ends[0];
    for(let k=0;k<L;k++){ const ti=b.tiles[k]; const from=k===0?[ax,ay]:[b.tiles[k-1]%N,(b.tiles[k-1]/N)|0];
      for(let q=0;q<BT.dam.s;q++) P.push(pc('stone','dambed',from,{n:q,ti,tk:k}));
      for(let q=0;q<BT.dam.w;q++) P.push(pc('wood','damlog',from,{n:q,ti,tk:k})); }
  } else if(t==='trap'){
    P.push(pc('wood','stake',[b.sx,b.sy],{n:0}));

      const m=0.32, X0=gd.x0-0.5-m, X1=gd.x0+gd.fw-0.5+m, Y0=gd.y0-0.5-m, Y1=gd.y0+gd.fh-0.5+m, cx=(X0+X1)/2, cy=(Y0+Y1)/2;

          P.push(pc('wood','picket',at,{n:n++,seg:[a,g0]})); P.push(pc('wood','picket',at,{n:n++,seg:[g1,c]})); b.gate=[g0,g1]; }

      const X0=h.x0-0.5, X1=h.x0+h.fw-0.5, Y1=h.y0+h.fh-0.5, yF=Y1+1.5;
      b.round='front';
      P.push(pc('wood','picket',standAt(b,h.dx+1,h.dy+1),{n:0,seg:[[h.dx+0.5,yF],[X1,yF]]}));
      P.push(pc('wood','picket',standAt(b,h.x0+h.fw,h.dy),{n:1,seg:[[X1,yF],[X1,Y1+0.05]]}));
      P.push(pc('wood','picket',standAt(b,h.dx-1,h.dy+1),{n:2,seg:[[X0,yF],[h.dx-0.5,yF]]}));

  } else if(t==='bank'){

function callHelpers(v,radius,max){

    case 'goStory': {
      const b=g.job&&g.job.b; if(!b||!evening()){ g.st='idle'; break; }

    case 'skip': { g.t-=dt; if(g.hop<=0&&chance(dt*2.5)) g.hop=0.4; if(g.arrived){ goTo(g,g.x+rnd(-2,2)*S,g.y+rnd(-2,2)*S); } if(g.t<=0){ g.st='idle'; g.decide=0.3; } break; }

function makeBaby(a,b){

  gnomes.push(baby); STATS.born++;

/* a couple with a cabin of their own, and room in it, makes eyes at each other */
function breeding(dt){

  village.breed=3.5;
  if(gnomes.length>=POP_CAP) return;
  if(store.food<5+gnomes.length*1.6) return;
  if(T.light<0.3||dayPhase()==='night') return;
  for(const a of gnomes){
    if(a.sex!=='f'||a.stage!=='adult'||!a.mate||a.cool>0||a.inside) continue;
    const c=a.mate; if(gnomes.indexOf(c)<0||c.stage!=='adult'||c.cool>0||c.inside) continue;
    const h=homeOf(a); if(!h||!isCabin(h)||homeOf(c)!==h) continue;
    if((h.kids||[]).filter(k=>gnomes.indexOf(k)>=0&&k.home===h).length>=2) continue;   // two children at a time
    if(a.hunger>0.42||a.energy<0.35||c.hunger>0.42||c.energy<0.35) continue;
    if(BUSY[a.st]&&a.st!=='warming'&&a.st!=='chat') continue;
    if(BUSY[c.st]&&c.st!=='warming'&&c.st!=='chat') continue;
    if(d2g(a,c.x,c.y)>20*20*S2) continue;
    const mx=(a.x+c.x)/2, my=(a.y+c.y)/2;
    clearMarks(a); clearMarks(c); releaseBed(a); releaseBed(c);
    a.st=c.st='court'; a.job=c.job=null; a.partner=c; c.partner=a; a.t=c.t=16;
    goTo(a,mx-0.4*S,my); goTo(c,mx+0.4*S,my);
    return;
  }

function needs(g,dt){

  const ns=stageOf(g.age);
  if(ns!==g.stage){
    const was=g.stage; g.stage=ns; g.h=heightOf(ns);
    if(was==='baby') g.hat=hatFor(g.sex,vilOf(g));
    if(ns==='adult'&&was==='child'){ toast(g.name+' is all grown up'); logEv(g.name+' is all grown up — time to find a place of '+(g.sex==='f'?'her':'his')+' own'); leaveHome(g); g.soloT=T.abs; }   // v9.17: the partner clock starts here

  }
  if(g.age>=AGE_LEAVE&&g.st!=='goAdventure'&&g.st!=='adventure'&&!g.inside&&g.st!=='sleep'&&!g.player) setOff(g);
  let hr=0.62;
  if(g.st==='sleep') hr*=0.45;
  if(g.stage==='baby') hr*=0.5; else if(g.stage==='child') hr*=0.8;
  hr*=1+T.cold*0.55+(W.kind==='snow'?0.1:0);            // the cold burns through a gnome
  g.hunger=clamp01(g.hunger+hr*d);
  if(g.st==='sleep') g.energy=clamp01(g.energy+dt*(g.restIn?0.16:0.072));
  else g.energy=clamp01(g.energy-d*0.72*(g.stage==='baby'?0.6:1));

  if(W.rain>0.3) tw-=0.20;
  if(W.snow>0.3) tw-=0.28;
  tw-=T.cold*0.55;

  g.warm=clamp01(g.warm+clamp(tw-g.warm,-1,1)*dt*0.22);

}
/* personal space: nobody stands on another's toes. Two gnomes closer than
   SEP are eased apart, each only onto ground it could have walked to; the
   states where two must meet (a courtship, a rescue) or where the ground
   holds the gnome (a fishing spot, a boat, a bed) are left alone */
const NO_SPACE={float:1,swept:1,boat:1,sleep:1,fishing:1,court:1,comfort:1,help:1,goRescue:1,heave:1,huddle:1,shelter:1,shiver:1,flee:1,yelp:1,adventure:1,goAdventure:1,dance:1,paddle:1,snow:1,row:1,passenger:1,netFish:1,aloft:1,flyPrep:1,atSummit:1};
/* the space is measured on the screen, not on the ground: the view squashes
   depth to half, so two gnomes a step apart in depth still stand one on the
   other. RX/RY are the half-widths of the clear ellipse in px at zoom 1 (a
   gnome is ~14 px tall and ~8 wide); the push runs along the direction that
   opens the ellipse fastest, which is mostly sideways */
const SEP_RX=10, SEP_RY=8;
function nudge(g,dx,dy){
  const nx=clamp(g.x+dx,1,N-2), ny=clamp(g.y+dy,1,N-2);
  const ci=I(Math.round(g.x),Math.round(g.y)), ni=I(Math.round(nx),Math.round(ny));
  if(ni!==ci&&(OCC[ni]||!isFinite(stepCost(ci,ni,g.stage!=='baby'))||Math.abs(tileH(ni)-tileH(ci))>0.6||wetD(ni)>0.15||(BRIDGE[ni]>0)!==(BRIDGE[ci]>0))) return false;   // never off a ledge, into water or off a bridge
  g.x=nx; g.y=ny; return true;
}
function spaceOut(dt){
  const n=gnomes.length, HX=TW/2, HY=TH/2;
  for(let a=0;a<n;a++){
    const g=gnomes[a]; if(g.inside||NO_SPACE[g.st]||g.swim>0.3) continue;          // swimmers are left alone: a push in the water is slower than the swimmer and pins the pair
    for(let b=a+1;b<n;b++){
      const o=gnomes[b]; if(o.inside||NO_SPACE[o.st]||o.swim>0.3) continue;
      let dx=o.x-g.x, dy=o.y-g.y;
      if(dx*dx+dy*dy>2.5*2.5) continue;                                   // nowhere near
      if(dx*dx+dy*dy<1e-6){ const an=(g.id*2.399)%TAU; dx=Math.cos(an)*0.01; dy=Math.sin(an)*0.01; }
      const rx=dx*rotC-dy*rotS, ry=dx*rotS+dy*rotC;                        // as the camera sees it
      const sx=(rx-ry)*HX, sy=(rx+ry)*HY;                                   // px at zoom 1
      const m=(sx*sx)/(SEP_RX*SEP_RX)+(sy*sy)/(SEP_RY*SEP_RY);
      if(m>=1) continue;
      // step sideways on the screen (the quick way apart); which way, the pair decides once
      const sg=Math.abs(sx)>0.3?Math.sign(sx):((g.id+o.id)&1?1:-1);
      const gx=(rotC-rotS)*0.7071*sg, gy=-(rotC+rotS)*0.7071*sg;           // the world direction that runs across the screen
      const k=dt*((g.moving||o.moving)?2.6:1.4)*0.5;                       // half the push each; a walking pair parts quicker
      let a1=nudge(g,-gx*k,-gy*k), a2=nudge(o,gx*k,gy*k);
      if(!a1&&!a2){ a1=nudge(g,gx*k,gy*k); a2=nudge(o,-gx*k,-gy*k); if(a1&&!a2) nudge(g,gx*k,gy*k); else if(a2&&!a1) nudge(o,-gx*k,-gy*k); }   // hemmed in that way: try the other
      else if(a1&&!a2) nudge(g,-gx*k,-gy*k); else if(a2&&!a1) nudge(o,gx*k,gy*k);   // one of them is hemmed in: the other takes the whole step
    }
  }
}

  }
  if(type==='steps'){

/* a tap while a pick is in hand: the ghost moves there (or, for a run of flagstones, the tile joins or leaves the run) */

    if(k>=0) PB.tiles.splice(k,1); else if(pbTileOK(i)&&PB.tiles.length<14) PB.tiles.push(i); else toast('not that tile: stone goes on dry open ground'); }

}
function pbPick(type){
  PB.pick=type; PB.tiles.length=0; PB.ghost=pbGhost(type);
  if(PB.ghost&&PB.ghost.tiles.length&&PB.ghost.ok) toast(pbLabel(type)+': tap Place');

function pbClear(){ PB.pick=null; PB.ghost=null; PB.tiles.length=0; }
/* Place: the ghost becomes the player's own project, and the gnome starts on it */
function pbPlace(){
  const gh=PB.ghost; if(!gh||!gh.ok||!PLAYER||gnomes.indexOf(PLAYER)<0) return false;
  const old=ownsProject(PLAYER);
  if(old){ toast('finish or stop your '+pbLabel(old.type).toLowerCase()+' first'); return false; }
  const b=gh.mk(); if(!b) return false;
  b.mine=true; if(!b.plan) stageProject(b);
  if(b.type==='fire'&&hamletSite(b.x,b.y)){ b.hamlet=true; logEv('You are laying a fire far out from the village — when it is lit, your household will have a hamlet of its own',b); }
  builds.push(b); PLAYER.project=b; PB.paused=false;
  logEv('You are raising a '+pbLabel(b.type).toLowerCase(),b); toast('You start on the '+pbLabel(b.type).toLowerCase());
  pbClear();
  clearMarks(PLAYER); releaseBed(PLAYER); PLAYER.job=null; if(PLAYER.st!=='sleep'&&!PLAYER_HOLD[PLAYER.st]){ PLAYER.st='idle'; PLAYER.decide=0; }
  return true;
}
/* Stop: the site is taken down; what was carried there goes back to the store */
function pbStop(){
  const b=PLAYER&&ownsProject(PLAYER); if(!b) return false;
  if(b.got){ store.wood+=b.got.wood||0; store.stone+=b.got.stone||0; store.fibre+=b.got.fibre||0; }
  if(b.tiles) for(const i of b.tiles){ BRIDGE[i]=0; PIER[i]=0; if(b.type==='dam') DAM[i]=0; }
  if(b.home){ if(b.type==='garden') b.home.gardenTried=false; if(b.type==='fence') b.home.fenceTried=false; if(b.type==='hive') b.home.hiveTried=false; }
  removeBuild(b); PLAYER.project=null;
  for(const g of gnomes) if(g.job&&(g.job.b===b||g.job.site===b)){ g.job=null; if(g.st!=='sleep'){ g.st='idle'; g.decide=0.2; } }
  toast('The '+pbLabel(b.type).toLowerCase()+' is left'); logEv('You gave up the '+pbLabel(b.type).toLowerCase(),{x:b.x,y:b.y});
  return true;
}
/* the player's own build, in words for the card and the rail */
function pbStatus(){

  let want=''; if(b.plan&&b.pi<n){ const nx=b.plan[b.pi]; if(nx.m&&b.got[nx.m]<=0){ const short=store[nx.m]-reserveOf(nx.m)<1; want=short?' · needs '+(nx.m==='fibre'?'reeds':nx.m)+' (none in the store)':''; } }

/* the ghost on the ground: each tile a pane, green where it may go, red where not */
function drawGhost(){
  const gh=PB.ghost; if(!gh) return;
  const tiles=gh.tiles.length?gh.tiles:PB.tiles; if(!tiles.length) return;
  const ok=gh.ok, Z=cam.z;
  ctx.fillStyle=ok?'rgba(150,215,150,0.42)':'rgba(235,120,120,0.42)'; ctx.strokeStyle=ok?'rgba(70,140,80,0.9)':'rgba(170,60,60,0.9)'; ctx.lineWidth=Math.max(1,1.2*Z); ctx.lineJoin='round';

/* ---------- audio ----------------------------------------------------------
   Nothing here is noise. Every sound is a rounded sine through a soft room and
   a low-pass, so the island is birdsong, a burbling stream, an owl and the
   gnomes' own small sounds — never a hiss or a rush.
   -------------------------------------------------------------------------- */
let AC=null, master=null, verb=null, verbGain=null, audioOn=false, muted=false;
function initAudio(){
  if(AC) return;
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx) return;
  try{ AC=new Ctx(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=0.84;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2100; lp.Q.value=0.3;
  const hs=AC.createBiquadFilter(); hs.type='highshelf'; hs.frequency.value=1100; hs.gain.value=-6;
  const cp=AC.createDynamicsCompressor();
  cp.threshold.value=-24; cp.knee.value=28; cp.ratio.value=3.0; cp.attack.value=0.03; cp.release.value=0.45;
  master.connect(lp); lp.connect(hs); hs.connect(cp); cp.connect(AC.destination);
  verb=AC.createConvolver(); verb.buffer=makeIR(2.2,2.8);
  verbGain=AC.createGain(); verbGain.gain.value=0.36;
  const vlp=AC.createBiquadFilter(); vlp.type='lowpass'; vlp.frequency.value=1600; vlp.Q.value=0.2;
  verb.connect(vlp); vlp.connect(verbGain); verbGain.connect(master);
  audioOn=true;
}
function makeIR(sec,decay){
  const n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(2,n,AC.sampleRate);
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c); let lp=0;
    for(let i=0;i<n;i++){ const t=i/n; const w=(Math.random()*2-1)*Math.pow(1-t,decay); lp=lp*0.74+w*0.26; d[i]=lp*0.9; }
  }
  return b;
}
function panOf(x,y){
  const p=screenOf(x,y===undefined?0:y,SEAS);
  return clamp((p.x-cw/2)/(cw*0.55),-1,1);
}
function audibleGain(x,y){
  const p=screenOf(x,y,SEAS);
  const dx=Math.abs(p.x-cw/2)/(cw*0.85), dy=Math.abs(p.y-chh/2)/(chh*0.85);
  return clamp01(1-Math.max(dx,dy));
}
function tone(freq,dur,o){
  o=o||{};
  if(!audioOn||muted||!AC) return;
  const t=AC.currentTime+(o.delay||0);
  const osc=AC.createOscillator(); osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(freq,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30,o.to),t+dur*(o.toAt||0.92));
  const g=AC.createGain();
  const vol=Math.max(0.0008,(o.gain===undefined?0.08:o.gain));
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+(o.att||0.045));
  if(o.hold) g.gain.setValueAtTime(vol,t+(o.att||0.045)+o.hold);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g);
  const p=AC.createStereoPanner?AC.createStereoPanner():null;
  if(p){ p.pan.value=clamp(o.pan||0,-1,1); g.connect(p); p.connect(master); if(verb&&!o.dry) p.connect(verb); }
  else { g.connect(master); if(verb&&!o.dry) g.connect(verb); }
  if(o.wob){
    const l=AC.createOscillator(); l.frequency.value=o.wob;
    const lg=AC.createGain(); lg.gain.value=freq*(o.wobd||0.05);
    l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t+dur+0.05);
  }
  osc.start(t); osc.stop(t+dur+0.05);
}
function gtone(g,freq,dur,o){
  o=o||{}; o.pan=panOf(g.x,g.y);
  const a=audibleGain(g.x,g.y); if(a<=0.02) return;
  o.gain=(o.gain===undefined?0.08:o.gain)*a;
  tone(freq,dur,o);
}
/* ---------- how often a cue may sound (v9.11) ---------------------------------
   Jed: "sound should not be warped, it gets irritating." At speed the same
   events come round many times faster than they would in life — a dozen gnomes
   swinging a dozen times a second — and the cues ran together into a rattle.
   So every kind of sound keeps its own gap in REAL time, and the faster the
   isle is running the wider that gap: at 1x nothing changes at all, at 20x you
   hear one chop of the twenty, which is the sound of a wood being cleared
   rather than a machine. The ambience (birds, crickets, the stream, the rain)
   is driven by the frame instead of the sim, so it keeps its own pace whatever
   the speed. */
const AGAP={};
function aOK(k,base,soft){
  if(!audioOn||muted) return false;
  const sp=clamp(T.speed||1,1,20), sc=soft?1+(sp-1)*0.45:sp;
  const gap=base*sc, t=now||0, p=AGAP[k]||-1e9;
  if(t-p<gap) return false;
  AGAP[k]=t; return true;
}

/* ---------- birdsong -------------------------------------------------------
   Six voices, each a small phrase of glided sine notes. Phrases are placed on a
   real tree, panned to where it is on screen, and quieter the further it sits

function noteRun(notes,pan,vol){
  let t=0;
  for(const n of notes){
    tone(n.f,n.d,{gain:vol*(n.g||1),pan,att:n.a||0.028,to:n.to||n.f*1.02,toAt:0.85,delay:t,wob:n.w,wobd:n.wd});
    t+=n.d+(n.gap===undefined?0.07:n.gap);
  }
  return t;
}
const VOICES=[
  function robin(pan,vol){        // wandering thirds, a little sad
    const b=700+vrng()*180, n=3+vrint(0,2), notes=[];
    for(let i=0;i<n;i++){ const up=i%2===0; const f=b*(up?1:0.84)*(1+vrng()*0.05); notes.push({f,d:0.13+vrng()*0.06,to:f*(up?0.94:1.06),gap:0.06+vrng()*0.05}); }
    return noteRun(notes,pan,vol);
  },
  function warbler(pan,vol){      // a quick bright trill
    const b=880+vrng()*240, n=5+vrint(0,3), notes=[];
    for(let i=0;i<n;i++){ const f=b*(1+0.18*Math.sin(i/(n-1)*Math.PI)); notes.push({f,d:0.07,to:f*0.97,gap:0.035,a:0.018}); }
    return noteRun(notes,pan,vol*0.85);
  },
  function thrush(pan,vol){       // "tu-wee", said twice or three times
    const b=500+vrng()*120, reps=2+vrint(0,1), notes=[];
    for(let r=0;r<reps;r++){ notes.push({f:b,d:0.11,to:b*1.03,gap:0.03}); notes.push({f:b*1.42,d:0.20,to:b*1.60,gap:0.28,a:0.035}); }
    return noteRun(notes,pan,vol);
  },
  function chiffchaff(pan,vol){   // two notes, back and forth
    const hi=800+vrng()*90, lo=hi*0.86, n=4+vrint(0,2), notes=[];
    for(let i=0;i<n;i++){ const f=i%2?lo:hi; notes.push({f,d:0.10,to:f*0.98,gap:0.09}); }
    return noteRun(notes,pan,vol*0.9);
  },
  function blackbird(pan,vol){    // slow and fluty — the soothing one
    const b=460+vrng()*140, n=3+vrint(0,1), notes=[];
    for(let i=0;i<n;i++){ const f=b*[1,1.25,1.12,1.5][i%4]*(1+vrng()*0.03); notes.push({f,d:0.22+vrng()*0.10,to:f*(vchance(0.5)?1.08:0.93),gap:0.10,a:0.05,w:5.5,wd:0.012}); }

    for(let i=0;i<n;i++){ const f=b*(1.22-0.32*i/(n-1))*(1+(i%2)*0.06); notes.push({f,d:0.06+vrng()*0.02,to:f*0.95,gap:0.03,a:0.016}); }
    return noteRun(notes,pan,vol*0.8);

let birdT=0, ambT=0, cricketT=0, streamAcc=0, rainAcc=0, fireAcc=0, waterScanT=0, visibleFlow=0, flowSpots=[];
function scanWater(){
  visibleFlow=0; flowSpots.length=0;
  for(let y=1;y<N-1;y+=1) for(let x=1;x<N-1;x+=1){
    const i=y*N+x;
    if(FLOW[i]<FLOW_STREAM*1.4&&!(DAM[i]&&WD[i]>0.05)) continue;
    const a=audibleGain(x,y); if(a<0.05) continue;
    visibleFlow+=a; if(flowSpots.length<40) flowSpots.push([x,y,a]);
  }
}
function updateAudio(dt){
  if(!audioOn||muted) return;
  waterScanT-=dt; if(waterScanT<=0){ waterScanT=0.6; scanWater(); }
  const dawn=T.f>0.20&&T.f<0.36, dusk=T.f>0.66&&T.f<0.81, day=T.light>0.22;
  const weather=(1-W.rain*0.7)*(1-W.snow*0.6)*(T.season===3?0.55:1);
  birdT-=dt;
  if(birdT<=0){
    birdT = !day ? vrnd(20,40) : dawn ? vrnd(0.9,2.2) : dusk ? vrnd(1.6,3.4) : vrnd(2.2,5.0);
    if(day&&trees.length&&vchance(weather)){
      const t=aTreeNearView()||{x:villagePos().x,y:villagePos().y};
      const len=singFrom(t.x,t.y,false);
      if(t.blobs) landBird(t,len+2.5+vrng()*3);
      if(vchance(dawn?0.6:0.35)){ const far=vchance(0.5); const t2=aTreeNearView()||t;
        setTimeout(()=>{ if(audioOn&&!muted) singFrom(t2.x+vrnd(-3,3)*S,t2.y+vrnd(-3,3)*S,far); },(len+0.4+vrng()*0.9)*1000); }
    }
  }
  // the stream: a scatter of round bubbles wherever water is running on screen
  if(visibleFlow>0.05&&flowSpots.length){
    streamAcc+=dt*clamp(visibleFlow*1.6,1,6)*clamp01(cam.z/0.9);
    while(streamAcc>1){ streamAcc-=1; const s=flowSpots[(vrng()*flowSpots.length)|0]; burble(s[0],s[1],s[2]); }
  }
  if(W.rain>0.25){ rainAcc+=dt*W.rain*9; while(rainAcc>1){ rainAcc-=1; plip(); } }
  fireAcc+=dt;
  if(fireAcc>0.3){ fireAcc=0; for(const b of builds) if(b.type==='fire'&&b.done&&vchance(0.5)) firePop(b); }
  cricketT-=dt;
  if(cricketT<=0){
    cricketT=vrnd(2.5,6);
    if(T.light<0.2&&T.season!==3&&W.rain<0.3&&W.snow<0.3){ const c=villagePos(); sfxCricket(c.x+vrnd(-8,8)*S,c.y+vrnd(-8,8)*S); }
  }
  ambT-=dt;
  if(ambT<=0){
    ambT=vrnd(11,26);
    const c=villagePos();
    if(T.light<0.18){ if(vchance(0.45)) sfxOwl(c.x+vrnd(-6,6)*S,c.y+vrnd(-6,6)*S); }
    else if(T.f>0.62&&T.f<0.86){ if(vchance(0.5)) sfxDove(c.x+vrnd(-6,6)*S,c.y+vrnd(-6,6)*S); }
  }
}

/* ---------- camera & projection ------------------------------------------ */
let cvs,ctx,cw=390,chh=800,dpr=1,now=0;
const VANCH=0.46;
const cam={ox:0,oy:0,z:0.8,fitZ:0.8,ang:0,angT:0,follow:null,free:false};
function initRender(){ cvs=document.getElementById('cv'); ctx=cvs.getContext('2d'); skyC=document.createElement('canvas'); skyG=skyC.getContext('2d'); }
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cw=window.innerWidth; chh=window.innerHeight;
  cvs.width=Math.round(cw*dpr); cvs.height=Math.round(chh*dpr);
  if(!cam.free&&world.name) fitCam(); else clampCam();
}
/* rotation about the island's middle, by any angle; the quarter-turns the
   buttons ask for are eased through, so the isle swings round on screen */
const CTR=(N-1)/2;
let rotC=1, rotS=0;
function setAngle(a){ cam.ang=a; rotC=Math.cos(a); rotS=Math.sin(a); orderDirty=true; }
function rotXY(x,y){ const dx=x-CTR, dy=y-CTR; return [CTR+dx*rotC-dy*rotS, CTR+dx*rotS+dy*rotC]; }
function invRot(rx,ry){ const dx=rx-CTR, dy=ry-CTR; return [CTR+dx*rotC+dy*rotS, CTR-dx*rotS+dy*rotC]; }
function rotVec(gx,gy){ return [gx*rotC-gy*rotS, gx*rotS+gy*rotC]; }
function turnStep(dt){
  const d=cam.angT-cam.ang;
  if(Math.abs(d)<0.0015){ if(d!==0) setAngle(cam.angT); return; }
  // a button turn swings round over half a second; a finger twist follows
  // the fingers within a tenth, smoothing out their tremor
  setAngle(cam.ang+d*(1-Math.pow(pinch?0.00002:0.0008,dt)));
}
/* tiles back to front for the current angle, recomputed only when it changes.
   Zoomed out, the island is drawn in cells of 2×2 fine tiles (the v7 grid):
   the same picture at a quarter of the quads. */
const ORDER=new Int32Array(NC), ORDIDX=new Int32Array(NC), DEPTH=new Float32Array(NC);
const NL=N/2, NLC=NL*NL;
const ORDER2=new Int32Array(NLC), ORDIDX2=new Int32Array(NLC), DEPTH2=new Float32Array(NLC);
let orderDirty=true;
const LOD_PX=15;
function lodCS(){ return TW*cam.z<LOD_PX?2:1; }
/* a counting sort on the depth (1/64 of a tile per bucket): the same order a
   comparison sort gives, at a tenth of the cost, so a finger twist stays smooth */
const OB=new Int32Array(2*N*64+8), OK=new Int32Array(NC);
function orderBy(n,depth,order,oidx){
  OB.fill(0);
  for(let i=0;i<n;i++){ const k=Math.max(0,Math.min(OB.length-2,(depth[i]*64+64)|0)); OK[i]=k; OB[k+1]++; }
  for(let k=1;k<OB.length;k++) OB[k]+=OB[k-1];
  for(let i=0;i<n;i++){ const k=OK[i]; const pos=OB[k]++; order[pos]=i; oidx[i]=pos; }
}
function tileOrder(){
  if(!orderDirty) return;
  orderDirty=false;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const i=y*N+x, r=rotXY(x,y); DEPTH[i]=r[0]+r[1]; }
  orderBy(NC,DEPTH,ORDER,ORDIDX);
  for(let y=0;y<NL;y++) for(let x=0;x<NL;x++){ const i=y*NL+x, r=rotXY(x*2+0.5,y*2+0.5); DEPTH2[i]=r[0]+r[1]; }
  orderBy(NLC,DEPTH2,ORDER2,ORDIDX2);
}
function sxOf(rx,ry){ return cw/2+(rx-ry)*(TW/2)*cam.z+cam.ox; }
function syOf(rx,ry,e){ return chh*VANCH+((rx+ry)-(N-1))*(TH/2)*cam.z-(e-SEAS)*EH*cam.z+cam.oy; }
function screenOf(x,y,e){ const r=rotXY(x,y); return { x:sxOf(r[0],r[1]), y:syOf(r[0],r[1],e) }; }
function landBox(){
  let a=1e9,b=-1e9,c=1e9,d=-1e9,any=false;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const i=y*N+x;
    if(E[i]<=SEA) continue;
    const r=rotXY(x,y);
    const u=(r[0]-r[1])*(TW/2), top=Math.max(E[i],E[i]+wetD(i));
    const v=((r[0]+r[1])-(N-1))*(TH/2)-(top-SEAS)*EH;
    if(u-TW/2<a)a=u-TW/2; if(u+TW/2>b)b=u+TW/2;
    if(v-TH/2<c)c=v-TH/2; if(v+TH*1.4>d)d=v+TH*1.4;
    any=true;
  }
  if(!any){ a=-N*TW/2;b=N*TW/2;c=-N*TH/2;d=N*TH/2; }
  return {a,b,c,d};
}
function fitCam(){
  const L=landBox();
  const availW=Math.max(120,cw-18), availH=Math.max(160,chh*0.58);
  cam.z=clamp(Math.min(availW*1.16/Math.max(1,L.b-L.a),availH/Math.max(1,L.d-L.c)),0.16,2.8);
  cam.ox=-((L.a+L.b)/2)*cam.z;
  cam.oy=-((L.c+L.d)/2)*cam.z;
  cam.fitZ=cam.z;
  clampCam();
}
function clampCam(){
  cam.z=clamp(cam.z,Math.min(0.30,cam.fitZ*0.85),3.0);
  const lim=Math.max(240,(N*TW*cam.z)*0.56);
  cam.ox=clamp(cam.ox,-lim,lim);
  cam.oy=clamp(cam.oy,-lim,lim);
}
/* screen positions of every ground and water vertex, refreshed each frame */
const SVX=new Float32Array(NV*NV), SVY=new Float32Array(NV*NV), SWY=new Float32Array(NV*NV);
function projectVerts(){
  for(let vy=0;vy<NV;vy++) for(let vx=0;vx<NV;vx++){
    const k=vy*NV+vx, r=rotXY(vx-0.5,vy-0.5);
    SVX[k]=sxOf(r[0],r[1]); SVY[k]=syOf(r[0],r[1],V[k]); SWY[k]=syOf(r[0],r[1],VW[k]);
  }
}
function screenToTile(sx,sy){
  // nearest to the camera first, so a slope in front wins over the ground behind it
  tileOrder();
  for(let k=NC-1;k>=0;k--){
    const i=ORDER[k], x=i%N, y=(i/N)|0;

/* the boathouse's slip: two stringers and boards from inside the open front down into the water, and the boat on the stocks */
function drawSlip(b,F,zb,zf,part){

/* a picket fence: each run is a rail on short pale pickets, drawn in world space along its segment */

  const lw=Math.max(0.6,cam.z*0.9);

  // warm picket white with a darker rail, and the gateway's two posts
  const runs=b.plan.filter(p=>p.k==='picket'&&p.seg);
  for(let q=0;q<Math.min(runs.length,n);q++){
    const [a,c]=runs[q].seg, len=Math.hypot(c[0]-a[0],c[1]-a[1]), np=Math.max(2,Math.round(len/0.24));
    ctx.strokeStyle=GC('#EFE6D6'); ctx.lineWidth=lw; ctx.lineCap='round';
    for(let k=0;k<=np;k++){ const f=k/np, x=lerp(a[0],c[0],f), y=lerp(a[1],c[1],f), g0=eLerp(x,y); const p0=wp(x,y,g0), p1=wp(x,y,g0+0.26+(k%2?0.03:0)); ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke(); }
    ctx.strokeStyle=GC('#CDBFA9'); ctx.lineWidth=lw*0.8; const r0=wp(a[0],a[1],eLerp(a[0],a[1])+0.17), r1=wp(c[0],c[1],eLerp(c[0],c[1])+0.17); ctx.beginPath(); ctx.moveTo(r0.x,r0.y); ctx.lineTo(r1.x,r1.y); ctx.stroke();
  }
  if(b.gate&&n>=runs.length){ ctx.strokeStyle=GC('#C9B79C'); ctx.lineWidth=lw*1.5; ctx.lineCap='round';
    for(const g of b.gate){ const z0=eLerp(g[0],g[1]); const p0=wp(g[0],g[1],z0), p1=wp(g[0],g[1],z0+0.40); ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
      ctx.fillStyle=GC('#EFE6D6'); ctx.beginPath(); ctx.arc(p1.x,p1.y,Math.max(0.8,lw*0.9),0,TAU); ctx.fill(); } }
}
/* v9.20 (Jed: "nothing incorrectly clipping over objects that should be in front"): a fence (round a garden, a yard, the
   fold) drawn whole was drawn at one depth — the fold's back runs were painted over the rabbits in front of them. Now each
   run is cut where it crosses from one tile to the next, and each piece is drawn with the tile on its outer side: a run on
   the far side of what it fences after everything on that tile (all of it behind the pickets), a run on the near side before
   everything on it (all of it in front); what is inside comes between. */
function fencePieces(b){
  if(b._fpc&&b._fpcN===b.plan.length) return b._fpc;
  const runs=b.plan.filter(p=>p.k==='picket'&&p.seg);
  let cx=0,cy=0;
  if(b.type==='fold'){ cx=b.x0+(b.fw-1)/2; cy=b.y0+(b.fh-1)/2; }
  else { for(const r of runs){ cx+=(r.seg[0][0]+r.seg[1][0])/2; cy+=(r.seg[0][1]+r.seg[1][1])/2; } cx/=runs.length||1; cy/=runs.length||1; }
  const normalOf=(a,c)=>{ let nx=-(c[1]-a[1]), ny=c[0]-a[0]; const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l; const mx=(a[0]+c[0])/2-cx, my=(a[1]+c[1])/2-cy; if(nx*mx+ny*my<0){ nx=-nx; ny=-ny; } return [nx,ny]; };
  const out=[];

    const [nx,ny]=normalOf(a,c), fs=[0,1];

      for(let k=Math.ceil(Math.min(p0,p1)-0.5);k<=Math.floor(Math.max(p0,p1)-0.5);k++){ const f=(k+0.5-p0)/(p1-p0); if(f>0.001&&f<0.999) fs.push(f); } }

      const tx=clamp(Math.round(mx+nx*0.25),0,N-1), ty=clamp(Math.round(my+ny*0.25),0,N-1);
      out.push({b,kind:'run',q,a,c,f0,f1,np,last:k+2===fs.length,nx,ny,ti:ty*N+tx}); } });
  if(b.gate){ const g0=b.gate[0], g1=b.gate[1], gx=(g0[0]+g1[0])/2, gy=(g0[1]+g1[1])/2, [nx,ny]=normalOf(g0,g1);
    const tx=clamp(Math.round(gx+nx*0.25),0,N-1), ty=clamp(Math.round(gy+ny*0.25),0,N-1);
    out.push({b,kind:b.type==='fold'?'gate':'posts',nx,ny,ti:ty*N+tx,nRuns:runs.length}); }
  b._fpc=out; b._fpcN=b.plan.length; return out;
}

/* the kitchen garden: dug rows with their crop coming on, and a young apple tree in the far corner */

      ctx.stroke(); } }

    ctx.strokeStyle=GC(soilD,0.7); ctx.lineWidth=Math.max(0.6,cam.z*0.9);
    { const a=wp(X0+0.3,ry+0.16,z+hB+0.02), c=wp(X0+GW-0.3,ry+0.16,z+hB+0.02); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke(); }

  // as a soft patch; the narrow worn ways between are drawn as ribbons. A worn tile with no worn or paved neighbour is a scuff

/* the ribbon's outline on the screen, cached for the frame: the curve offset to either side by its half-width, in world
   space, so it narrows as it turns away up the screen like the ground does */
function ribbonPts(cv,hw,key){
  if(cv[key]&&cv[key].n===drawN) return cv[key].pts;
  const L=[], R=[], NS=6;
  for(let k=0;k<=NS;k++){ const t=k/NS, p=curveAt(cv,t), n=curveTan(cv,t), ox=-n[1]*hw, oy=n[0]*hw;
    const lx=p[0]+ox, ly=p[1]+oy, rx=p[0]-ox, ry=p[1]-oy;
    L.push(wp(lx,ly,eLerp(lx,ly)+0.015)); R.push(wp(rx,ry,eLerp(rx,ry)+0.015)); }
  let pts=L.slice();
  if(cv.capB){ const p=curveAt(cv,1), n=curveTan(cv,1); for(const a of [1,2,3,4,5]){ const th=a*Math.PI/6; const x=p[0]+(-n[1]*Math.cos(th)+n[0]*Math.sin(th))*hw, y=p[1]+(n[0]*Math.cos(th)+n[1]*Math.sin(th))*hw; pts.push(wp(x,y,eLerp(x,y)+0.015)); } }
  for(let k=NS;k>=0;k--) pts.push(R[k]);
  if(cv.capA){ const p=curveAt(cv,0), n=curveTan(cv,0); for(const a of [1,2,3,4,5]){ const th=Math.PI+a*Math.PI/6; const x=p[0]+(-n[1]*Math.cos(th)+n[0]*Math.sin(th))*hw, y=p[1]+(n[0]*Math.cos(th)+n[1]*Math.sin(th))*hw; pts.push(wp(x,y,eLerp(x,y)+0.015)); } }

}
/* a flagstone: a rounded, slightly uneven slab lying flat on the ground, drawn in world space so it turns with the isle —
   eight points round an ellipse, each eased in or out a little, joined by a smooth curve (v9.22: it was a six-sided polygon,
   and read as a hexagon) */

function slabHash(s,k){ const v=Math.sin(s*12.9898+k*78.233)*43758.5453; return v-Math.floor(v); }
function drawSlab(cx,cy,ang,len,wid,seed,fog){

/* the hearth: slabs laid round the fire, each along the ring */

function earthCol(fog){ let ec=lit(T.cold>0.5?C.track:mixc(C.prep,C.dirtL,0.3)); if(fog>0.01) ec=mixc(ec,lit(FOGC),fog); return ec; }

/* a flight of steps, one tile of it: it runs the way the chain runs (from the step below to the step above, else up the slope) */

  if(lo>=0&&hi>=0){ gx=(hi%N)-(lo%N); gy=((hi/N)|0)-((lo/N)|0); }
  else if(lo>=0){ gx=x-(lo%N); gy=y-((lo/N)|0); }
  else if(hi>=0){ gx=(hi%N)-x; gy=((hi/N)|0)-y; }
  else { gx=eAt(x+1,y)-eAt(x-1,y); gy=eAt(x,y+1)-eAt(x,y-1); }

function ambientFx(dt){

  const dusk=T.light<0.32&&T.f>0.5, summer=T.season===1;
  if(warm&&dusk&&trees.length){

    const rate=(summer?3.2:1.2)*clamp01((0.32-T.light)/0.2);
    if(vchance(dt*rate)){ const v=villagePos(); const x=v.x+vrnd(-7,7), y=v.y+vrnd(-7,7); const i=I(clamp(Math.round(x),0,N-1),clamp(Math.round(y),0,N-1)); if(E[i]>SEA+0.4&&wetD(i)<0.1&&!OCC[i]) fireflyFx(x,y); }

    const mx=(SVX[va]+SVX[vb])/2, my=(edges[e][3]+edges[e][4])/2;             // the edge's middle

    for(let q=0;q<n;q++){

      ctx.beginPath(); ctx.ellipse(px,py,(1.6+ph*1.4)*Z,(0.9+ph*0.7)*Z,0,0,TAU); ctx.fill();
    }
  }
  if(fl>FLOW_STREAM*0.7&&E[i]>SEA){
    // the current: pale streaks running the way the water goes, on every tile
    // of a stream (two on a river), each on its own phase, so the flow can be
    // seen at a glance — this is what says "water" more than the colour does
    if(wetDV(i)>0.05){

/* ---------- the weather, drawn over the isle ----------------------------------
   Rain falls as short pale streaks leaning with the wind; snow as soft flakes
   that drift; and while the storm's bank is crossing, its shadow sweeps the
   ground beneath it. All of it is placed by a hash of its own index and the
   clock, so nothing here touches the sim. */
function drawWeather(){
  const Z=cam.z;
  // v9.15: the storm's bank no longer sweeps a navy band across the picture (a
  // shadow, and Jed wants none); the bank's cover dims the light evenly
  // (computeAmbient) and the rain itself is what the storm shows.
  if(W.rain>0.06){
    // rain, in the scene: short soft drops over the isle, not scratches over the
    // glass — none above the horizon, each a slightly blue dash that fades along
    // its length, leaning with the wind; a storm's are denser and a little longer
    const hy=horizonY();
    const n=Math.round(W.rain*95*(cw*chh)/(390*800)), t=now*0.001;
    const zz=Math.max(0.7,Math.min(1.4,Z));
    const slant=-W.wind*(7+6*W.rain)*zz, len=(5+4*W.rain)*zz, sp=(460+240*W.rain)*zz;
    const al=0.13+0.15*W.rain;
    ctx.lineWidth=Math.max(0.6,0.75*zz); ctx.lineCap='round';
    for(let pass=0;pass<2;pass++){
      // two layers: the far one fainter and shorter, the near one brighter
      const near=pass===1, a=near?al:al*0.55, L=near?len:len*0.65, k0=near?0:1;
      ctx.strokeStyle='rgba(206,224,240,'+a.toFixed(3)+')';
      ctx.beginPath();
      for(let k=k0;k<n;k+=2){
        const h1=nzAt(k*0.731+3.1,k*0.379+1.7), h2=nzAt(k*0.517+9.3,k*0.211+4.4);
        const x=((h1*3.7+h2*1.3)*cw*1.6+t*slant*4)%(cw+80)-40, y=((h2*5.1*chh)+t*sp*(0.85+h1*0.3))%(chh+60)-40;
        if(y<hy-6) continue;
        const xx=x<-40?x+cw+80:x;
        ctx.moveTo(xx,y); ctx.lineTo(xx+slant*0.22,y+L);
      }
      ctx.stroke();
    }
  }
  if(W.snow>0.06){
    const n=Math.round(W.snow*120*(cw*chh)/(390*800)), t=now*0.001;
    ctx.fillStyle='rgba(248,250,255,0.82)';
    for(let k=0;k<n;k++){
      const h1=nzAt(k*0.731+13.1,k*0.379+7.7), h2=nzAt(k*0.517+19.3,k*0.211+2.4);
      const sway=Math.sin(t*(0.5+h1*0.5)+k)*(12+10*h2)*Z;
      const x=((h1*3.7+h2*1.3)*cw*1.6+t*W.wind*14+sway)%(cw+60)-30, y=((h2*5.1*chh)+t*(24+30*h1)*Math.max(0.7,Math.min(1.5,Z)))%(chh+40)-20;
      const r=(0.9+h1*1.3)*Math.max(0.7,Math.min(1.5,Z));
      ctx.beginPath(); ctx.arc(x<-30?x+cw+60:x,y,r,0,TAU); ctx.fill();
    }
  }
  // the lightning: a soft flash over the whole picture, gone in a tenth of a second
  if(W.flash>0.02){ ctx.fillStyle='rgba(236,240,255,'+(0.38*W.flash).toFixed(3)+')'; ctx.fillRect(0,0,cw,chh); }
}


/* ---------- the constructs, v9.8 ----------------------------------------------
   Everything the village raises over water or on a slope is drawn in world
   space, in the cabin's own language: stone as cobbled faces, timber as round
   logs with their end grain showing, every face lit by where it points. So a
   bridge is three logs lashed across on cobbled abutments and piers, a dam a
   crib of logs on a stone bed with the water sheeting over its spillway, the
   mill a small log house with its wheel hung beside the wall, dipping in the
   stream. */
/* a square-ish block of cobbled stone on four corners (world xy, in order round
   the block): the faces that show, each down to the ground at its own corners,
   and a flat cap. skip(nx,ny) says which faces are buried. */
function stoneFace(a,c,zbA,zbC,z1,L,seed){
  const zLow=Math.max(zbA,zbC);
  if(zbA<zLow-0.01||zbC<zLow-0.01){ ctx.fillStyle=shade('#A8A4B6',L); poly([wp(a[0],a[1],zbA),wp(c[0],c[1],zbC),wp(c[0],c[1],zLow+0.01),wp(a[0],a[1],zLow+0.01)]); ctx.fill(); }
  if(z1-zLow>0.03) cobbles(a,c,zLow,z1,L,seed);
}
function stoneBlock(pts,zTop,zBot,seed,skip,capCol){
  const cx=(pts[0][0]+pts[2][0])/2, cy=(pts[0][1]+pts[2][1])/2;
  for(let e=0;e<4;e++){ const a=pts[e], c=pts[(e+1)%4]; let nx=(a[1]-c[1]), ny=(c[0]-a[0]); const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl; const mx=(a[0]+c[0])/2-cx, my=(a[1]+c[1])/2-cy; if(nx*mx+ny*my<0){ nx=-nx; ny=-ny; }
    if(skip&&skip(nx,ny)) continue; if(!faceVis(nx,ny,0)) continue; const L=faceLight(nx,ny);
    stoneFace(a,c,zBot(a[0],a[1]),zBot(c[0],c[1]),zTop,L,seed+e*13); }
  ctx.fillStyle=shade(capCol||'#BDBACB',1.04); poly(pts.map(p=>wp(p[0],p[1],zTop))); ctx.fill();
  ctx.strokeStyle=shade('#8E8AA0',1,0.45); ctx.lineWidth=Math.max(0.4,cam.z*0.5); ctx.stroke();
}
/* a round log lying along a segment, its centre line from (x0,y0,z0) to

   is wide on the screen. The top, the side toward the viewer, a light along the
   crown and a seam along the far edge; and the end grain at whichever end faces
   the viewer, when e0/e1 ask for it. */

  poly([wp(x0+sx,y0+sy,z0-rv*0.25),wp(x1+sx,y1+sy,z1-rv*0.25),wp(x1+sx,y1+sy,z1-rv),wp(x0+sx,y0+sy,z0-rv)]); ctx.fillStyle=shade('#8E7A6C',1,0.35); ctx.fill();
  const lw=Math.max(0.5,cam.z*0.6);
  { const a=wp(x0-px*hw*0.2,y0-py*hw*0.2,z0+rv), c=wp(x1-px*hw*0.2,y1-py*hw*0.2,z1+rv); ctx.strokeStyle=shade('#F2E2CA',1,0.5); ctx.lineWidth=lw*1.1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke(); }
  { const a=wp(x0-sx,y0-sy,z0+rv), c=wp(x1-sx,y1-sy,z1+rv); ctx.strokeStyle=shade('#8E7A6C',1,0.55); ctx.lineWidth=lw*0.8; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke(); }

function grainAt(P,ax,ay,hw,rv,L){

/* a rope lashing round the deck at a joint: a dark band across the logs and a

function lashing(x,y,ux,uy,px,py,h,W,lwz){

/* the deck of a bridge over one stretch: from f0 to f1 along the way (in tiles
   from the tile centre), the way's height going from h0 to h1. Logs: three

const DECK_HW=0.40, LOG_HW=0.125, LOG_P=[-0.265,0,0.265];
function deckLogs(x,y,ux,uy,px,py,f0,f1,h0,h1,nLogs,e0,e1){
  const rv=LOG_HW*0.55;
  for(let q=0;q<Math.min(3,nLogs);q++){ const o=LOG_P[q]; logRib(x+ux*f0+px*o,y+uy*f0+py*o,h0-rv,x+ux*f1+px*o,y+uy*f1+py*o,h1-rv,LOG_HW,q===1?'#D2B393':'#C9AB8C',e0,e1); }

function deckPlanks(x,y,ux,uy,px,py,f0,f1,h0,h1,nBoards,withStringers){
  const rv=0.09*0.55;

    const fa=f0+(f1-f0)*q/n+0.012, fb=f0+(f1-f0)*(q+1)/n-0.012;

    ctx.strokeStyle=shade('#8E7A6C',1,0.45); ctx.lineWidth=lw; ctx.stroke();

  }

/* a rail post and rail on both sides of a stretch */
function deckRails(x,y,ux,uy,px,py,f0,f1,h0,h1,post,rope,bar){

    if(post){ const hm=lerp(h0,h1,(0-f0)/(f1-f0)); const a=wp(x+px*sd,y+py*sd,hm), c=wp(x+px*sd,y+py*sd,hm+RH+0.04); ctx.strokeStyle=shade('#A38C7C',faceLight(px,py)); ctx.lineWidth=Math.max(0.9,s*0.06); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke();
      ctx.fillStyle=shade('#8E7A6C',1); ctx.beginPath(); ctx.arc(c.x,c.y,Math.max(0.8,s*0.035),0,TAU); ctx.fill(); }

/* the abutment at a bank end: a cobbled block at the water's edge, from the
   bank down into the water, with the deck running out over its cap */
function drawAbutment(b,ti){
  const x=ti%N, y=(ti/N)|0, ux=b.ux, uy=b.uy, L=b.tiles.length, logs=b.type==='logbridge';
  const near=b.ends&&ti===I(b.ends[0][0],b.ends[0][1]);
  const tx=near?ux:-ux, ty=near?uy:-uy;                // toward the water
  const px=-ty, py=tx;
  const building=!b.done&&b.plan;
  const endK=near?0:L-1;
  if(building){ const n=laidOn(b,b.tiles[endK],logs?'deck':'plank'); if(n<1) return; }
  const hEnd=b.decks?b.decks[endK]:b.deck, h0=b.deck, h1=(hEnd+b.deck)/2;      // the deck at the bank, and where it meets the first stretch
  // the deck runs on past the water's edge by a tenth of the span (a quarter
  // tile at the least) onto the levelled bank, flat ground to flat ground; the
  // cobbled block sits under it at the water's edge, its bottom following the bank down

  { const zBot=(qx,qy)=>Math.min(eLerp(qx,qy)-0.04,wl-0.12);
    stoneBlock(pts,zTop,zBot,(x*7+y*13)|0,(nx,ny)=>(nx*tx+ny*ty)<-0.5); }   // the back face is in the bank
  const k0=building?laidOn(b,b.tiles[endK],logs?'deck':'plank'):3;

/* how far a bridge or a dam runs on past the water at each end: a tenth of the
   span, and (v9.14) six tenths of a tile at the least — past the middle of the
   landing tile, which is drawn dry (p2 wetDrawn: the ends are chosen by the
   same rule the painting uses), so the deck or the wall always comes to rest
   on the bank the picture shows, never a hand short of it in the water */
function spanOver(b){ let L=0; for(const i of b.tiles) if(wetDrawn(i)||b.type==='dam') L++; return clamp(0.10*Math.max(L,b.tiles.length*0.6),0.60,0.85); }
/* a stone pier standing in the river under the deck, with a wet line at the water */
function drawPier(b,ti,k,h,pierN){

  const bed=E[ti], hw=0.27, hl=0.19, hTop=pierN>=2?h-LOG_HW*0.55*2-0.02:lerp(bed-0.2,h,0.55);

function mooringOf(h,k){

/* what a gnome at the machines is doing, for its card */

    case 'goWatch': return 'off to watch the flight';
    case 'watch': { const F=j&&j.F; if(!F) return 'watching'; if(g.cheer>0) return 'cheering the '+F.kind+' down'; if(F.st==='gather'||F.st==='inflate') return F.kind==='balloon'?'watching the balloon filled':'waiting on the green for the glider'; return 'watching the '+F.kind+' fly'; }
    case 'goFly': return (j&&j.F&&j.F.kind==='glider')?'off to fetch the glider from the workshop':'off to the balloon';
    case 'flyPrep': return j&&j.role==='pass'?'waiting by the basket':'firing up the balloon';
    case 'carryGlider': return 'carrying the glider up to the summit';
    case 'atSummit': return 'at the summit with the glider, waiting for the wind';
    case 'aloft': { const F=g.inFlyer; return !F?'flying':F.kind==='glider'?'flying the glider':g===F.pilot?'flying the balloon':'up in the balloon'; }
    case 'goRow': return j&&j.role==='pass'?'off to the boat for a trip':'off to the boat';

/* the beach slipway, where no shore will take a boathouse: two log runners down the sand into the sea, two trestles */
